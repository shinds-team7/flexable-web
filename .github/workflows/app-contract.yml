name: app-contract

# 앱 저장소의 웹 연동 계약(docs/contracts/web-link-api.yaml)과 이 저장소의 사본(docs/contracts/vendor/)이 같은지 본다.
# 다르면 앱이 계약을 바꾼 것이니 사본을 갱신하고(npm run sync:app-contract) RestAppApiClient·AppSpecFixtureTest를 맞춘다.
# 필수 검사가 아니라 다른 PR의 머지를 막지 않는다. 매일 한 번과 연동 코드를 고친 PR에서 돈다.
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/contracts/vendor/**'
      - 'backend/src/main/java/com/flexable/web/applink/**'

jobs:
  app-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 앱 web-link-api.yaml과 사본 비교
        run: |
          curl -fsSL https://raw.githubusercontent.com/shinds-team7/flexable-app/main/docs/contracts/web-link-api.yaml -o /tmp/app.yaml
          if ! diff -u --strip-trailing-cr docs/contracts/vendor/web-link-api.yaml /tmp/app.yaml; then
            echo "::error::앱 web-link-api.yaml이 바뀌었어요. npm run sync:app-contract로 사본을 갱신하고 RestAppApiClient·AppSpecFixtureTest를 맞춰 주세요(docs/contracts/README.md)"
            exit 1
          fi
