plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.flexable'
version = '0.1.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
    implementation 'org.jsoup:jsoup:1.24.1'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-mysql'
	runtimeOnly 'com.mysql:mysql-connector-j'
	developmentOnly 'com.h2database:h2'
	testRuntimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
	// docs/contracts/web-api.yaml로 실제 응답을 검사하는 계약 테스트(contract.ContractTest)
	testImplementation 'com.atlassian.oai:swagger-request-validator-core:2.44.9'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	// Spring 테스트 컨텍스트(각자 메모리 H2)가 여러 개 캐시돼 기본 힙 512MB로는 CI에서 OutOfMemoryError가 난다(11-10 main·PR #379)
	maxHeapSize = '1g'
	// worker 프로필도 자동 공식 HTTP 수집을 실행하지 않는다.
	// 실데이터 opt-in은 OfficialCashLiveTest가 클라이언트를 명시적으로 호출한다.
	systemProperty 'app.ingest.cash.enabled', 'false'
	// 계약·정책 테스트가 읽는 저장소 파일. 바뀌면 테스트를 다시 돌린다(ContractTest·*PolicyTest)
	inputs.dir('../docs/contracts').withPropertyName('contracts')
	inputs.dir('../tests/policy').withPropertyName('policyCases')
}

tasks.named('bootJar') {
	archiveFileName = 'web.jar'
}

tasks.named('jar') {
	enabled = false
}
