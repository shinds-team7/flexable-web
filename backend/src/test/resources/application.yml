# 테스트는 이 파일이 main의 application.yml을 대신한다.
spring:
  datasource:
    url: jdbc:h2:mem:test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

app:
  auth:
    jwt:
      # 실행마다 임의 키. 저장소에 고정 키를 두지 않는다.
      secret: ${random.value}
      ttl-days: 30
    oauth:
      callback-base-url: http://localhost:8080
      allowed-redirect-uris: http://localhost:5173/oauth/callback,https://example.com/callback?source=web
      kakao:
        client-id: ""
        client-secret: ""
        admin-key: ""
        scope: ""
      google:
        client-id: ""
        client-secret: ""
  cors-origins: http://localhost:5173
  market:
    top-limit: 100
  ingest:
    price-source: fake
    instrument-source: fake
    instrument-fallback: none
    run-on-start: false
    disclosure-source: fake
    dart:
      call-delay: 0s
    youth:
      source: fake
      run-on-start: false
      call-delay: 0s
    gemini:
      api-key: ""
      call-delay: 0s
  applink:
    # 테스트는 AppApiClient를 바꿔 끼운다. 암호화 키는 실행마다 임의 값.
    mode: http
    base-url: ""
    service-key: ""
    encryption-key: ""
    connect-timeout: 1s
    read-timeout: 1s
    refresh-interval: 0s
