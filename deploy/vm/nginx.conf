# 앞단(아카데미 프록시)이 HTTPS(443)를 끝내고 VM 80번으로 넘긴다. 이 nginx는 정적 파일과 /api 프록시만 한다.

# 앞단이 준 X-Forwarded-Proto(https)를 그대로 넘긴다. 없으면 이 연결의 scheme.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# 접속 기록: 쿼리 문자열(로그인 code 등)과 리퍼러는 남기지 않는다. 남기는 항목은 웹 개인정보처리방침 1항과 맞춘다.
log_format web_access '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    access_log /var/log/nginx/access.log web_access;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 30s;
    }

    # 빌드 산출물(파일 이름에 해시)은 오래 캐시한다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /m/ {
        try_files $uri $uri/ /m/index.html;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
