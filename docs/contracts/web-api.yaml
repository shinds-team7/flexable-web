              marketCap: { type: integer, format: int64, nullable: true }
        source: { type: string, nullable: true }
        note: { type: string, nullable: true }
        dataAsOf: { type: string, format: date, nullable: true }
    EvidenceRow:
      type: object
      required: [type, externalId, title, publisher, date, url, weight]
