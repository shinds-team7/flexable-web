openapi: 3.0.3
info:
  title: 텅장관리 웹 API
  version: 1.0.0
  description: |
    브라우저(웹 프론트) ↔ 웹 백엔드(Spring) 계약. 이 파일이 정본이다.
    - 백엔드 `ContractTest`가 실제 응답을 이 스펙으로 검사한다(정의되지 않은 필드도 실패).
    - 프론트 타입은 `npm run gen:api`로 `src/lib/api-schema.d.ts`에 만들고, 목 서버는 `npm run mock:api`.
    - 바꿀 때는 구현보다 먼저 이 파일을 고치는 PR(`spec-change` 라벨 + docs/CHANGELOG.md)을 올린다.
    - 금액은 원 단위 정수, 비율·수익률은 소수(0.05 = 5%), 시각은 +09:00이 붙은 ISO-8601이다.
    - 웹 백엔드가 부르는 앱 서버 `/internal/v1/web-links/*`는 앱 저장소 `docs/contracts/web-link-api.yaml`이 정본이다.
servers:
  - url: /api/v1
security:
  - bearer: []
tags:
  - name: auth
  - name: user
  - name: seed-money
  - name: app-link
  - name: goal
  - name: market
  - name: simulation
  - name: practice
    description: '사건 퀴즈 투자 시뮬레이션(#88 구현). 기존 simulation과 별도이며 policies §5 적용'
  - name: virtual-sim
    description: '가상 시뮬레이션(구현 전). AI가 만든 가상 종목·사건 글과 실제 공시 전체 통계 룰셋으로 서버가 만든 가상 시세. 매매·평가는 policies §5, 날짜·봉·검사·경향은 §8(일반 세션 채점 없음, 11-05). practice와 세션·상한을 따로 둔다. 회원 월간 대회(/virtual-sim/contests/*, /me/virtual-sim/contests, 구현됨, 앱 보상 지급만 후속)는 §8-8: 시즌마다 배치고사로 시작 판, 같은 판 안에서 잔액을 이어 가며 하루 목표 점수를 주마다 더해 승급·강등, 사건 4개·대회 판 채점 없음·하루 10판·판별 점수 랭킹'
  - name: savings
    description: '적금 비교(F2). 로그인 없이 쓴다. finlife 공시·온통청년 정책을 DB에서 읽고 만기 금액은 서버가 계산(내림)'
  - name: deposit
    description: '정기예금 비교(#140). 로그인 없이 쓴다. finlife 정기예금 공시를 DB에서 읽고 만기 금액은 서버가 계산(내림). 적금(savings)과 같은 모양이고 매달 넣는 돈 대신 한 번에 맡기는 금액을 쓴다'
  - name: youth-news
  - name: guide-contents
    description: '금융 가이드 글별 조회수. 로그인 없이 쓰고 계정과 연결하지 않는다'
  - name: client-errors
    description: '브라우저 오류 기록(error_events). 로그인 없이 보낼 수 있고 서버가 저장 전에 가린다. 30일 보관'
  - name: health

paths:
  /parking/products:
    get: &cashCatalogList
      tags: [deposit]
      summary: '파킹·CMA 공시 금리·조건 목록(계산 없음)'
      description: '이용 조건을 확인한 출처의 저장된 전체 목록. 회사명·상품명·id 순. 필터·나란히 비교는 클라이언트가 수행하며 금액/이자는 계산하지 않는다. 미적재 시 빈 목록, isSample=false.'
      security: []
      responses:
        '200':
          description: '공시 목록. 출처 승인이나 수집 성공을 의미하는 예시 상품을 넣지 않는다.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashCatalogList' }
  /cma/products:
    get: *cashCatalogList
  /cma/simulate:
    post:
      tags: [deposit]
      summary: 'CMA 예상 이자 계산(서버 계산, 일 단위 ÷365, 세금 15.4% 내림, 재투자 미반영)'
      description: |
        policies §12(규칙 cma-calc-v1). 공시 약정수익률이 하나인 상품(AGREED_RATE)과 원문에 보유 기간별 수익률이 적힌 상품(PERIOD_RATE)만 계산한다. 수익률이 유지된다고 가정한 예상이며 재투자(복리)는 반영하지 않는다. 원금 손실 가능성과 예금자보호 여부는 `notice`와 목록의 `depositProtected`로 보인다.
        목록의 `calculable`이 false인 상품은 400(`fields.productId`에 이유). PERIOD_RATE에서 일수가 마지막 구간을 넘으면 400(`fields.days`). 없는 상품은 404.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [productId, amount, days]
              properties:
                productId: { type: string, minLength: 1, description: '`/cma/products`의 상품 id' }
                amount: { type: integer, format: int64, minimum: 1, maximum: 10000000000, description: '맡긴 돈(원)' }
                days: { type: integer, minimum: 1, maximum: 3650, description: '맡기는 일수' }
      responses:
        '200':
          description: 계산 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CmaSimulation' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /parking/simulate:
    post:
      tags: [deposit]
      summary: '파킹통장 기본금리 이자 계산(서버 계산, 일 단위 ÷365, 세금 15.4% 내림)'
      description: |
        policies §11(규칙 parking-calc-v2). 공시 기본금리 하나(BASE_RATE) 또는 원문에 구간 안의 금액에만 적용한다고 적힌 구간별 금리(TIERED)로 계산한다. 우대·이벤트는 넣지 않는다.
        목록의 `calculable`이 false인 상품은 400(`fields.productId`에 이유)이다. 없는 상품은 404.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [productId, amount, days]
              properties:
                productId: { type: string, minLength: 1, description: '`/parking/products`의 상품 id' }
                amount: { type: integer, format: int64, minimum: 1, maximum: 10000000000, description: '맡긴 돈(원)' }
                days: { type: integer, minimum: 1, maximum: 3650, description: '맡기는 일수' }
      responses:
        '200':
          description: 계산 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParkingSimulation' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /practice/categories:
    get:
      tags: [practice]
      summary: '준비된 업종과 후보 종목 수'
      security: []
      responses:
        '200':
          description: '후보가 없으면 categories는 빈 배열. 키움 업종명 정규화와 내부 코드 생성은 결정 기록 참조'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [categories, isSample]
                properties:
                  isSample: { type: boolean }
                  categories:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [code, name, classificationVersion, eligibleCount]
                      properties:
                        code: { type: string }
                        name: { type: string }
                        classificationVersion: { type: string }
                        eligibleCount: { type: integer, minimum: 1 }
        '503': { $ref: '#/components/responses/Error' }
  /practice/start:
    post:
      tags: [practice]
      summary: '무작위 종목 선정, 최초 매수와 첫 봉. 로그인·영구 저장 없음'
      description: '동일 startId와 동일 입력은 세션 생존 중 같은 시작 응답. 같은 ID·다른 입력은 409. 종료·만료 후 같은 ID는 새 실행이다. 성공 응답은 no-store. 동시 재전송도 세션 하나만 생성한다.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [startId, categoryCode, initialAmount]
              properties:
                startId: { type: string, format: uuid }
                categoryCode: { type: string, minLength: 1, maxLength: 32 }
                initialAmount: { type: integer, format: int64, minimum: 10000, maximum: 100000000 }
      responses:
        '200':
          description: 'version=0, 첫 봉만 공개. sessionToken은 256비트 이상 임의 토큰, expiresAt은 시작 후 30분'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [sessionToken, expiresAt, snapshot]
                properties:
                  sessionToken: { type: string, minLength: 43, maxLength: 128 }
                  expiresAt: { type: string, format: date-time }
                  snapshot: { $ref: '#/components/schemas/PracticeSnapshot' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /practice/state:
    post:
      tags: [practice]
      summary: '현재까지의 상태만 재조회(no-store)'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PracticeToken' }
      responses:
        '200':
          description: 현재 상태
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PracticeSnapshot' }
        '400': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
  /practice/step:
    post:
      tags: [practice]
      summary: '다음 멈춤까지 진행(no-store)'
      description: 'RUNNING에서만 진행. 다음 사건이 나오는 거래일 또는 마지막 봉까지 한 번에 진행하고 version은 1 증가. 문제에서 멈추거나 끝났으면 409. 같은 commandId·같은 본문 재전송은 원래 응답을 반환'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PracticeCommand' }
      responses:
        '200':
          description: 새 봉까지의 상태. 이후 가격·사건·정답은 제외
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PracticeSnapshot' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
  /practice/decision:
    post:
      tags: [practice]
      summary: '현재 사건의 방향 예상과 가상 매매 선택(no-store)'
      description: 'AWAITING_DECISION의 eventId만 허용. 선택을 기록하고 RUNNING으로 바꾸며 version 증가. 봉은 아직 진행하지 않고 다음 step에서 시가 체결'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sessionToken, commandId, expectedVersion, eventId, prediction, action, allocationPercent]
              properties:
                sessionToken: { type: string, minLength: 43, maxLength: 128 }
                commandId: { type: string, format: uuid }
                expectedVersion: { type: integer, minimum: 0 }
                eventId: { type: string }
                prediction: { type: string, enum: [POSITIVE, NEGATIVE] }
                action: { type: string, enum: [BUY, SELL, HOLD] }
                allocationPercent: { type: integer, enum: [0, 25, 50, 100], description: 'HOLD는 0만, BUY/SELL은 25/50/100만 허용' }
      responses:
        '200':
          description: 선택을 접수한 상태. 판정 전 정답은 없음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PracticeSnapshot' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
  /practice/end:
    post:
      tags: [practice]
      summary: '세션 즉시 삭제. 없는 토큰·반복 종료도 204'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PracticeToken' }
      responses:
        '204': { description: 삭제 완료 }
        '400': { $ref: '#/components/responses/Error' }
  /virtual-sim/status:
    get:
      tags: [virtual-sim]
      summary: '가상 시뮬레이션을 시작할 수 있는지'
      security: []
      responses:
        '200':
          description: '공개 가능한 가상 종목(사건 3개 이상)과 룰셋이 있으면 available=true. 없으면 화면은 준비 중 안내'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [available, isSample]
                properties:
                  available: { type: boolean }
                  isSample: { type: boolean, description: '예시 작성기·예시 룰셋(VIRTUAL_SIM_SOURCE=fake)이면 true' }
        '503': { $ref: '#/components/responses/Error' }
  /virtual-sim/start:
    post:
      tags: [virtual-sim]
      summary: '가상 종목 하나를 무작위로 받고 최초 매수와 첫 봉. 로그인·영구 저장 없음'
      description: 'startId 중복 처리·no-store·동시 재전송은 /practice/start와 같다. 서버가 시드로 구간(120~250거래일)·사건 위치(3~5개)·OHLC를 만들고 시드는 내보내지 않는다. 날짜는 세션 시작일(KST) 연도 + 10년. 새 세션 시작은 클라이언트(접속 IP)마다 10분에 20번까지이고 넘으면 429 TOO_MANY_ATTEMPTS(retryAfterSeconds). 같은 startId 재전송은 세지 않는다'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [startId, initialAmount]
              properties:
                startId: { type: string, format: uuid }
                initialAmount: { type: integer, format: int64, minimum: 10000, maximum: 100000000 }
      responses:
        '200':
          description: 'version=0, 첫 봉만 공개. sessionToken은 256비트 이상 임의 토큰, expiresAt은 시작 후 30분'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [sessionToken, expiresAt, snapshot]
                properties:
                  sessionToken: { type: string, minLength: 43, maxLength: 128 }
                  expiresAt: { type: string, format: date-time }
                  snapshot: { $ref: '#/components/schemas/VirtualSimSnapshot' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /virtual-sim/state:
    post:
      tags: [virtual-sim]
      summary: '현재까지의 상태만 재조회(no-store)'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PracticeToken' }
      responses:
        '200':
          description: 현재 상태
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VirtualSimSnapshot' }
        '400': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
  /virtual-sim/step:
    post:
      tags: [virtual-sim]
      summary: '다음 멈춤까지 진행(no-store)'
      description: '/practice/step과 같다. RUNNING에서만 다음 사건이 나오는 거래일 또는 마지막 봉까지 진행하고 version 1 증가. 같은 commandId·같은 본문 재전송은 원래 응답'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PracticeCommand' }
      responses:
        '200':
          description: 새 봉까지의 상태. 이후 가격·사건·사건 유형·문제 수·정답은 제외
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VirtualSimSnapshot' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
  /virtual-sim/decision:
    post:
      tags: [virtual-sim]
      summary: '현재 가상 사건의 가상 매매 선택(수량 직접 입력, no-store)'
      description: 'AWAITING_DECISION의 eventId만 허용하고 다음 step에서 다음 거래일 시가로 체결한다. 예상 버튼은 없고 매매 방향이 예상이다(BUY = 오른다, SELL = 내린다, HOLD = 예상 없음, 채점 없음, policies §8-6). quantity는 HOLD면 0, BUY·SELL은 1 이상이고 event.orderLimits 안이어야 한다(넘으면 400 VALIDATION_FAILED, 응답 `fields.quantity`). 매수는 체결 시가로 그때 현금에 살 수 있는 만큼만 체결한다(부분 체결, 0주면 NO_FILL)'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sessionToken, commandId, expectedVersion, eventId, action, quantity]
              properties:
                sessionToken: { type: string, minLength: 43, maxLength: 128 }
                commandId: { type: string, format: uuid }
                expectedVersion: { type: integer, minimum: 0 }
                eventId: { type: string }
                action: { type: string, enum: [BUY, SELL, HOLD] }
                quantity: { type: integer, format: int64, minimum: 0, description: 'HOLD는 0만, BUY는 1~orderLimits.maxBuyShares, SELL은 1~orderLimits.maxSellShares. 대회 판은 잔액 상한이 없어 고정 최대값을 두지 않는다' }
      responses:
        '200':
          description: 선택을 접수한 상태. 판정 전 정답은 없음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VirtualSimSnapshot' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
  /virtual-sim/end:
    post:
      tags: [virtual-sim]
      summary: '세션 즉시 삭제. 없는 토큰·반복 종료도 204'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PracticeToken' }
      responses:
        '204': { description: 삭제 완료 }
        '400': { $ref: '#/components/responses/Error' }
  /virtual-sim/contests/current:
    get:
      tags: [virtual-sim]
      summary: '이번 달 대회 안내(로그인 없음). policies §8-8'
      description: '대회(시즌)는 매달 1일 00:00 ~ 다음 달 1일 00:00(KST). 배치고사로 참가하며 1일 00:00부터 받는다'
      security: []
      responses:
        '200':
          description: 이번 대회
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VirtualContest' }
