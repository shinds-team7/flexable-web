    CashCatalogList:
      type: object
      additionalProperties: false
      required: [items, isSample, notice]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CashCatalogProduct' } }
        isSample: { type: boolean, enum: [false] }
        notice: { type: string }
    CashCatalogProduct:
      type: object
      additionalProperties: false
      required: [id, company, name, sector, category, baseRate, maxRate, rateType, conditions, tags, calculable, calcReason, calcMode, tiers, periods, interestPayment, reinvestment, depositProtected, maxLimit, rateLimit, sourceName, sourceUrl, sourceAsOf, effectiveFrom, verifiedAt]
      properties:
        id: { type: string, minLength: 1 }
        company: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        sector: { type: string, enum: [BANK, SAVINGS_BANK, SECURITIES] }
        category: { type: string, nullable: true, enum: [RP, PROMISSORY_NOTE, null], description: '파킹은 null. CMA는 RP·발행어음만 지원' }
        baseRate: { type: number, minimum: 0, nullable: true, description: '공시 연 %, 세전. 미확인은 null이며 0으로 바꾸지 않는다' }
        maxRate: { type: number, minimum: 0, nullable: true, description: '공시 연 %, 세전. 우대조건 충족 여부를 판정하지 않는다' }
        rateType: { type: string, enum: [VARIABLE_DEPOSIT, AGREED], description: '파킹은 변동 예금금리, CMA는 약정수익률. 미래 수익 보장 아님' }
        conditions: { type: string, description: '금액·기간 구간과 우대조건 등 공시 조건 원문. 전체 잔액 적용인지 구간별 적용인지 생략하지 않는다' }
        tags:
          type: array
          description: '상품명·조건 원문에 정해 둔 낱말이 있으면 붙는 분류(policies §10, 규칙 cash-tags-v1). 낱말이 있다는 뜻일 뿐 가입 자격이나 우대 적용을 판정하지 않는다'
          items: { type: string, enum: [YOUTH, MILITARY, NON_FACE_TO_FACE, SALARY_LINK, AUTO_TRANSFER, CARD_USE] }
        calculable: { type: boolean, description: '파킹통장 기본금리 이자 계산을 제공하는 상품인지(policies §11 parking-calc-v1). CMA는 항상 false' }
        calcReason: { type: string, nullable: true, description: 'calculable이 false일 때 이유(사용자에게 그대로 보여 준다). true면 null' }
        calcMode:
          type: string
          nullable: true
          enum: [BASE_RATE, TIERED, AGREED_RATE, PERIOD_RATE, null]
          description: '파킹: BASE_RATE는 공시 기본금리 하나로, TIERED는 원문에 구간 안의 금액에만 적용한다고 적힌 구간별 금리로 계산(policies §11 parking-calc-v2). CMA: AGREED_RATE는 약정수익률 하나, PERIOD_RATE는 보유 기간별 수익률(policies §12 cma-calc-v1). 계산 불가면 null'
        tiers:
          type: array
          description: 'calcMode가 TIERED일 때 원문에서 읽은 구간(위로 올라가는 순서). 아니면 빈 배열'
          items:
            type: object
            additionalProperties: false
            required: [upTo, rate]
            properties:
              upTo: { type: integer, format: int64, nullable: true, description: '이 구간의 끝 금액(원). null이면 그 위 전부' }
              rate: { type: number, description: '그 구간 안의 금액에 적용하는 공시 연 %, 세전' }
        periods:
          type: array
          description: 'calcMode가 PERIOD_RATE일 때 원문에서 읽은 보유 기간별 수익률(1일부터 이어짐). 아니면 빈 배열'
          items:
            type: object
            additionalProperties: false
            required: [fromDay, toDay, rate]
            properties:
              fromDay: { type: integer, minimum: 1 }
              toDay: { type: integer, minimum: 1 }
              rate: { type: number, description: '그 기간 동안 보유할 때의 약정수익률(연 %, 세전)' }
        interestPayment: { type: string, nullable: true }
        reinvestment: { type: string, nullable: true }
        depositProtected: { type: boolean, nullable: true }
        maxLimit: { type: integer, format: int64, minimum: 0, nullable: true }
        rateLimit: { type: integer, format: int64, minimum: 0, nullable: true }
        sourceName: { type: string, minLength: 1 }
        sourceUrl: { type: string, format: uri, pattern: '^https://' }
        sourceAsOf: { type: string, format: date, nullable: true, description: '공시 기준일. 수집일로 대체하지 않음' }
        effectiveFrom: { type: string, format: date, nullable: true }
        verifiedAt: { type: string, format: date-time, description: '출처·형식·조건 검증 시각(+09:00)' }
    CmaSimulation:
      type: object
      additionalProperties: false
      required: [productId, amount, days, mode, rate, interestPreTax, tax, interestAfterTax, rulesVersion, notice]
      properties:
        productId: { type: string }
        amount: { type: integer, format: int64 }
        days: { type: integer }
        mode: { type: string, enum: [AGREED_RATE, PERIOD_RATE] }
        rate: { type: number, description: '계산에 쓴 약정수익률(연 %, 세전). PERIOD_RATE는 days가 속한 기간의 값' }
        interestPreTax: { type: integer, format: int64, description: 'floor(amount × rate × days ÷ 36500)' }
        tax: { type: integer, format: int64, description: 'floor(interestPreTax × 0.154)' }
        interestAfterTax: { type: integer, format: int64 }
        rulesVersion: { type: string, example: cma-calc-v1 }
        notice: { type: string }
    ParkingSimulation:
      type: object
      additionalProperties: false
