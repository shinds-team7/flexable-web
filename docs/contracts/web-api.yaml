      responses:
        '200':
          description: 많이 본 소식
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HotNews' }
              example:
                basis: SITE
                windowDays: 7
                items:
                  - { newsId: '1', visitors: 12 }

  /youth-news/{id}/views:
    post:
      tags: [youth-news]
      summary: '소식을 열었다고 센다(방문자·소식·날짜당 한 번). 계정과 연결하지 않는다'
      description: |
        - viewerId는 브라우저가 처음 한 번 만들어 localStorage에 둔 임의 UUID이다. 계정·IP와 이어 두지 않고 30일 뒤 지운다.
        - 이미 센 열람, 방문자 한 명의 하루 한도(40개 소식)를 넘은 열람은 오류 없이 204로 넘어간다.
        - 없거나 반려·미요약인 소식은 404, viewerId가 UUID가 아니면 400.
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [viewerId]
              properties:
                viewerId: { type: string, format: uuid }
      responses:
        '204': { description: 셈 }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /guide-contents/views:
    get:
      tags: [guide-contents]
      summary: '금융 가이드 글별 누적 조회수'
      description: '등록된 글 전부를 돌려준다. 아직 아무도 읽지 않은 글은 views가 0이다. 1분 캐시.'
      security: []
      responses:
        '200':
          description: 글별 조회수
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, views]
                      properties:
                        id: { type: string }
                        views: { type: integer, format: int64, minimum: 0 }
  /guide-contents/{id}/views:
    post:
      tags: [guide-contents]
      summary: '금융 가이드 글을 열었다고 센다(방문자·글·날짜당 한 번). 계정과 연결하지 않는다'
      description: |
        - id는 글 주소의 마지막 칸(예: interest-rate)이다.
        - viewerId는 브라우저가 처음 한 번 만들어 localStorage에 둔 임의 UUID이다. 계정·IP와 이어 두지 않고 30일 뒤 지운다. 글별 합계 숫자는 계속 남는다.
        - 이미 센 열람은 오류 없이 204로 넘어간다.
        - 등록되지 않은 글은 404, viewerId가 UUID가 아니면 400.
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [viewerId]
              properties:
                viewerId: { type: string, format: uuid }
      responses:
        '204': { description: 셈 }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /client-errors:
    post:
      tags: [client-errors]
      summary: '브라우저가 겪은 오류를 서버 오류 기록(error_events)에 남긴다'
      description: |
        - 로그인 없이 보낼 수 있다. 유효한 Bearer 토큰이 있으면 회원 번호를 함께 남기고, 만료·폐기된 토큰이면 401이다(화면은 토큰 없이 한 번 더 보낸다).
        - 형식이 맞으면 한도를 넘어 버려도 204이다. 보낸 사람(회원 번호, 비로그인이면 접속 IP)마다 10분에 30건까지만 저장하고, 하루 새 줄은 500개까지이다.
        - 서버가 저장 전에 메시지의 3자리 이상 숫자는 `#`, 이메일은 `***@***`로 가리고 경로의 쿼리를 버린다. 요청·응답 본문은 받지 않는다. 30일 뒤 지우고 탈퇴하면 그 회원 기록도 지운다.
        - 이 요청 자체의 실패는 다시 기록하지 않는다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, message]
              properties:
                kind: { type: string, enum: [API, CRASH, JS], description: 'API 요청 실패, CRASH 화면 오류 경계, JS 처리 못 한 브라우저 오류' }
                message: { type: string, maxLength: 2000 }
                stack: { type: string, maxLength: 8000, nullable: true }
                screen: { type: string, maxLength: 100, nullable: true, description: '화면 경로(쿼리 없음)' }
                method: { type: string, enum: [GET, POST, PUT, PATCH, DELETE], nullable: true }
                path: { type: string, maxLength: 300, nullable: true, description: 'API 경로(쿼리 없음)' }
                status: { type: integer, minimum: 0, maximum: 599, nullable: true }
                code: { type: string, maxLength: 40, nullable: true }
                appVersion: { type: string, maxLength: 20, nullable: true, description: '웹 빌드 버전' }
      responses:
        '204': { description: 받음(한도를 넘어 저장하지 않았어도 204) }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /health:
    get:
      tags: [health]
      summary: 살아 있는지
      security: []
      responses:
        '200':
          description: UP
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status: { type: string, enum: [UP] }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Provider:
      name: provider
      in: path
      required: true
      schema: { type: string, enum: [kakao, google] }

  responses:
    Error:
      description: '오류. code는 ErrorCode, message는 화면에 그대로 보여 줄 문장'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Auth:
      description: 웹 토큰과 계정
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthResponse' }
    Settings:
      description: 화면 설정
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Settings' }
    SeedMoney:
      description: 웹 시드머니
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SeedMoneyResponse' }
          example:
            source: app
            status: available
            total: 1450000
            base: 500000
            monthlyGoal: 300000
            startedOn: '2026-06-26'
            updatedAt: '2026-09-25T20:10:00+09:00'
            entries:
              - { cycleEnd: '2026-07-25', choice: GOAL, amount: 300000, totalAfter: 800000, createdAt: '2026-07-24T20:05:00+09:00' }
              - { cycleEnd: '2026-08-25', choice: MANUAL, amount: 0, totalAfter: 800000, createdAt: '2026-08-24T21:00:00+09:00' }
              - { cycleEnd: '2026-09-25', choice: ALL, amount: 650000, totalAfter: 1450000, createdAt: '2026-09-25T20:10:00+09:00' }
            sync: { status: fresh, syncedAt: '2026-10-27T09:00:00+09:00', due: false }
            manual: null
            appSync: null
    AppLink:
      description: 앱 연동 상태
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AppLink' }
    Goal:
      description: 목표와 AI 사용량
      content:
        application/json:
          schema:
            type: object
            required: [goal, ai]
            additionalProperties: false
            properties:
              goal: { $ref: '#/components/schemas/GoalView' }
              ai: { $ref: '#/components/schemas/AiStatus' }

  schemas:
    PracticeToken:
      type: object
      additionalProperties: false
      required: [sessionToken]
      properties:
        sessionToken: { type: string, minLength: 43, maxLength: 128 }
    PracticeCommand:
      type: object
      additionalProperties: false
      required: [sessionToken, commandId, expectedVersion]
      properties:
        sessionToken: { type: string, minLength: 43, maxLength: 128 }
        commandId: { type: string, format: uuid }
        expectedVersion: { type: integer, minimum: 0 }
    PracticePortfolio:
      type: object
      additionalProperties: false
      required: [cash, shares, stockValue, total, profit, returnRate]
      properties:
        cash: { type: integer, format: int64, minimum: 0 }
        shares: { type: integer, format: int64, minimum: 0 }
        stockValue: { type: integer, format: int64, minimum: 0 }
        total: { type: integer, format: int64, minimum: 0 }
        profit: { type: integer, format: int64 }
        returnRate: { type: number, description: '서버가 소수 4자리 내림' }
    PracticeSnapshot:
      type: object
      additionalProperties: false
      required: [version, status, instrument, initialAmount, isSample, totalDays, candles, frames, portfolio, event, decisions, notice, sources]
      properties:
        version: { type: integer, minimum: 0 }
        status: { type: string, enum: [RUNNING, AWAITING_DECISION, FINISHED] }
        instrument:
          type: object
          additionalProperties: false
          required: [code, name, categoryCode, categoryName, classificationVersion, classificationAsOf]
          properties:
            code: { type: string }
            name: { type: string }
            categoryCode: { type: string }
            categoryName: { type: string }
            classificationVersion: { type: string }
            classificationAsOf: { type: string, format: date }
        initialAmount: { type: integer, format: int64, minimum: 10000, maximum: 100000000 }
        isSample: { type: boolean }
        totalDays: { type: integer, minimum: 120, maximum: 250, description: '이번 실행의 전체 거래일 수. 종목마다 문제 3개 이상을 만나는 가장 짧은 구간(policies §5 재생 구간 고르기). 가격·사건은 공개한 봉까지만 준다' }
        candles:
          type: array
          minItems: 1
          maxItems: 250
          description: '공개된 봉만 날짜 오름차순. 아직 진행하지 않은 봉 없음'
          items:
            type: object
            additionalProperties: false
            required: [date, open, high, low, close]
            properties:
              date: { type: string, format: date }
              open: { type: integer, format: int64, minimum: 1 }
              high: { type: integer, format: int64, minimum: 1 }
              low: { type: integer, format: int64, minimum: 1 }
              close: { type: integer, format: int64, minimum: 1 }
        frames:
          type: array
          maxItems: 250
          description: 'step 응답에서만 이번에 새로 공개된 봉마다 그날 종가 기준 자산(날짜 오름차순, 마지막 항목 = portfolio). 화면은 이 구간을 3초에 나눠 재생한다. start·state·decision 응답은 빈 배열'
          items:
            type: object
            additionalProperties: false
            required: [date, portfolio]
            properties:
              date: { type: string, format: date }
              portfolio: { $ref: '#/components/schemas/PracticePortfolio' }
        portfolio: { $ref: '#/components/schemas/PracticePortfolio' }
        event:
          type: object
          nullable: true
          additionalProperties: false
          description: 'AWAITING_DECISION일 때만 현재 문제. 그 밖에는 null'
          required: [id, title, publishedDate, baselineDate, sourceUrl, sourceName]
          properties:
            id: { type: string }
            title: { type: string, description: '원문 공시 제목. 사후 급등/급락 요약 금지' }
            publishedDate: { type: string, format: date }
            baselineDate: { type: string, format: date, description: '현재 마지막 봉 날짜. 휴일 접수면 접수일보다 앞설 수 있음' }
            sourceUrl: { type: string, format: uri }
            sourceName: { type: string }
        decisions:
          type: array
          maxItems: 39
          description: '이미 제출한 선택만 반환. 판정 전 결과와 수익률은 null. 한 실행의 문제는 3개 이상이고 250거래일 간격 규칙상 최대 39개'
          items:
            type: object
            additionalProperties: false
            required: [eventId, title, publishedDate, baselineDate, sourceUrl, prediction, action, allocationPercent, execution, executedDate, executedPrice, executedShares, outcome, outcomeDate, subsequentReturnRate]
            properties:
              eventId: { type: string }
              title: { type: string }
              publishedDate: { type: string, format: date }
              baselineDate: { type: string, format: date }
              sourceUrl: { type: string, format: uri }
              prediction: { type: string, enum: [POSITIVE, NEGATIVE] }
              action: { type: string, enum: [BUY, SELL, HOLD] }
              allocationPercent: { type: integer, enum: [0, 25, 50, 100] }
              execution: { type: string, enum: [PENDING, FILLED, NO_FILL, HOLD] }
              executedDate: { type: string, format: date, nullable: true }
              executedPrice: { type: integer, format: int64, nullable: true, minimum: 1 }
              executedShares: { type: integer, format: int64, nullable: true, minimum: 0 }
              outcome: { type: string, nullable: true, enum: [CORRECT, INCORRECT, NEUTRAL, null] }
              outcomeDate: { type: string, format: date, nullable: true }
              subsequentReturnRate: { type: number, nullable: true }
        notice: { type: string, description: '과거 계산·원금 손실·비권유, 세금/수수료/배당 제외, 표본 편향과 현재 업종 분류 고지' }
        sources:
          type: array
          minItems: 1
          items: { type: string }
    VirtualSimCategory:
      type: string
      enum: [EARNINGS, SUPPLY_CONTRACT, NEW_SHARES, BONUS_SHARES, BONDS, BUYBACK_ACQUIRE, BUYBACK_DISPOSE, DIVIDEND, RESTRUCTURE, FACILITY, LEGAL, OWNERSHIP]
      description: '가상 사건 유형(vsim-types-v4, DART 공시 제목 분류). 이름은 categoryName. 결정 기록 2026-11-04-virtual-simulation 1-1'
    VirtualSimSnapshot:
      type: object
      additionalProperties: false
      required: [version, status, company, generator, ruleset, initialAmount, isSample, totalDays, candles, frames, portfolio, event, decisions, notice, sources]
      properties:
        version: { type: integer, minimum: 0 }
        status: { type: string, enum: [RUNNING, AWAITING_DECISION, FINISHED] }
        company:
          type: object
          additionalProperties: false
          description: '가상 종목. 실제 기업이 아니다. 이름·소개는 AI(예시면 예시 작성기)가 썼고 자동 검사를 통과했다. 업종은 서버 목록'
          required: [name, industry, intro]
          properties:
            name: { type: string, minLength: 2, maxLength: 10 }
            industry: { type: string }
            intro: { type: string, maxLength: 60 }
        generator:
          type: object
          additionalProperties: false
          description: '회사·사건 글을 누가 썼나. Gemini면 aiGenerated=true, 예시 작성기면 false·model=sample(isSample=true)'
          required: [aiGenerated, model, generatedAt]
          properties:
            aiGenerated: { type: boolean }
            model: { type: string }
            generatedAt: { type: string, format: date-time }
        ruleset:
          type: object
          additionalProperties: false
          description: '가격 움직임을 뽑은 통계. 실제 세션은 실제 시장 통계, 예시 세션(isSample=true)은 코드에 넣은 예시 룰셋이고 dataFrom·dataTo는 null. version: 지금은 vsim-rules-v3(사건 봉 + 후속 5거래일 경로, 공시 직후 상승 비율, 고정 경향)'
          required: [version, dataFrom, dataTo]
          properties:
            version: { type: string }
            dataFrom: { type: string, format: date, nullable: true }
            dataTo: { type: string, format: date, nullable: true }
        initialAmount: { type: integer, format: int64, minimum: 10000, description: '이 실행의 투자금. 일반 세션은 /virtual-sim/start의 initialAmount(10,000~100,000,000), 대회 판은 시작한 대회 잔액(1,000,000 이상, 상한 없음)' }
        isSample: { type: boolean, description: '예시 작성기·예시 룰셋으로 만든 학습용 자료. AI 생성 여부는 generator.aiGenerated' }
        contest: { $ref: '#/components/schemas/VirtualSimContestRound' }
        totalDays: { type: integer, minimum: 120, maximum: 250, description: '이번 실행의 전체 거래일 수(평일만 센 가상 날짜). 가격·사건은 공개한 봉까지만 준다' }
        candles:
          type: array
          minItems: 1
          maxItems: 250
          description: '공개된 봉만 날짜 오름차순. 날짜는 세션 시작일 연도 + 10년의 가상 날짜(평일). 서버가 룰셋으로 만든 값'
          items:
            type: object
            additionalProperties: false
            required: [date, open, high, low, close]
            properties:
              date: { type: string, format: date }
              open: { type: integer, format: int64, minimum: 1 }
              high: { type: integer, format: int64, minimum: 1 }
              low: { type: integer, format: int64, minimum: 1 }
              close: { type: integer, format: int64, minimum: 1 }
        frames:
          type: array
          maxItems: 250
          description: 'step 응답에서만 이번에 새로 공개된 봉마다 그날 종가 기준 자산(마지막 항목 = portfolio). start·state·decision 응답은 빈 배열'
          items:
            type: object
            additionalProperties: false
            required: [date, portfolio]
            properties:
              date: { type: string, format: date }
              portfolio: { $ref: '#/components/schemas/PracticePortfolio' }
        portfolio: { $ref: '#/components/schemas/PracticePortfolio' }
        event:
          type: object
          nullable: true
          additionalProperties: false
          description: 'AWAITING_DECISION일 때만 현재 가상 사건. 그 밖에는 null. 제목은 서버가 붙인 실제 공시 제목 형식, 본문은 AI가 쓴 중립 사실(좋고 나쁨·금액 없음). 이후 움직임은 같은 유형 실제 공시 뒤 경로에서 뽑는다'
          required: [id, category, categoryName, title, body, date, orderLimits]
          properties:
            id: { type: string }
            category: { $ref: '#/components/schemas/VirtualSimCategory' }
            categoryName: { type: string }
            title: { type: string, maxLength: 40, description: '유형마다 서버가 정한 실제 DART 보고서명 형식(예: 단일판매ㆍ공급계약체결)' }
            body: { type: string, maxLength: 240, description: 'AI가 쓴 공시 내용 2~4문장(vsim-check-v3, policies §8-5). 금액·규모·증감·좋고 나쁨 없음' }
            date: { type: string, format: date, description: '사건 봉 날짜(= 현재 마지막 봉). 가상 사건은 늘 거래일 종가 뒤에 보인다' }
            orderLimits:
              type: object
              additionalProperties: false
              description: '수량 입력 상한과 미리보기 기준(서버 계산). 화면은 수량 × referencePrice로 추정 금액만 보이고, 실제 체결은 다음 거래일 시가다'
              required: [referencePrice, maxBuyShares, maxSellShares]
              properties:
                referencePrice: { type: integer, format: int64, minimum: 1, description: '지금 마지막 봉 종가' }
                maxBuyShares: { type: integer, format: int64, minimum: 0, description: 'floor(현금 / referencePrice)' }
                maxSellShares: { type: integer, format: int64, minimum: 0, description: '보유 수량' }
        decisions:
          type: array
          maxItems: 5
          description: '이미 제출한 선택만 반환. 판정 전 결과·경향·수익률은 null. 일반 세션의 문제는 3~5개이고 공개 가능한 유형 전체에서 서로 다른 유형을 균등하게 뽑는다(경향 있는 유형 최소 개수 없음, 11-05), 대회 판은 4개이고 판별 유형 규칙(policies §8-8)'
          items:
            type: object
            additionalProperties: false
            required: [eventId, category, categoryName, title, date, prediction, action, quantity, execution, executedDate, executedPrice, executedShares, outcome, outcomeDate, subsequentReturnRate, reactionReturnRate, nextWeekReturnRate, movement, categoryUpShare, categoryDownShare, categorySampleCount, trend, trendOutcome]
            properties:
              eventId: { type: string }
              category: { $ref: '#/components/schemas/VirtualSimCategory' }
              categoryName: { type: string }
              title: { type: string }
              date: { type: string, format: date }
              prediction: { type: string, nullable: true, enum: [POSITIVE, NEGATIVE, null], description: '매매 방향에서 정한 예상. BUY → POSITIVE, SELL → NEGATIVE, HOLD → null' }
              action: { type: string, enum: [BUY, SELL, HOLD] }
              quantity: { type: integer, format: int64, minimum: 0, description: '요청 수량. 실제 체결 수량은 executedShares' }
              execution: { type: string, enum: [PENDING, FILLED, NO_FILL, HOLD] }
              executedDate: { type: string, format: date, nullable: true }
              executedPrice: { type: integer, format: int64, nullable: true, minimum: 1 }
              executedShares: { type: integer, format: int64, nullable: true, minimum: 0 }
              outcome: { type: string, nullable: true, enum: [CORRECT, INCORRECT, NEUTRAL, null], description: '늘 null(11-05 일반 세션 채점 없음, #253). 대회 판도 null. 판정 뒤 움직임은 movement·reactionReturnRate·nextWeekReturnRate로 본다' }
              outcomeDate: { type: string, format: date, nullable: true }
              subsequentReturnRate: { type: number, nullable: true, description: '판정 뒤만. 사건 봉 종가 → 5번째 후속 봉 종가 가상 등락(소수 4자리 내림). 11-10부터 화면은 reactionReturnRate·nextWeekReturnRate를 보이고 이 값은 호환을 위해 남긴다. 판정 전에는 null' }
              reactionReturnRate: { type: number, nullable: true, description: '판정 뒤만. 공시 직후 가상 등락(사건 봉 전날 종가 → 다음 봉 종가, 소수 4자리 내림, decisions/2026-11-10-vsim-ruleset-reaction-window). 판정 전에는 null' }
              nextWeekReturnRate: { type: number, nullable: true, description: '판정 뒤만. 그다음 주 가상 등락(다음 봉 종가 → 5번째 후속 봉 종가, 소수 4자리 내림). 사건을 보고 고른 매매는 다음 봉 시가에 체결하므로 실제 수익률과는 다를 수 있다. 판정 전에는 null' }
              movement: { type: string, nullable: true, enum: [UP, DOWN, FLAT, null], description: '판정 뒤만. 공시 직후(사건 봉 전날 종가 → 다음 봉 종가) 가상 등락의 방향(원 가격 비교, 11-10. 그 전에는 5거래일). 판정 전에는 null' }
              categoryUpShare: { type: number, nullable: true, minimum: 0, maximum: 1, description: '판정 뒤(movement가 null이 아닐 때)만. 룰셋에서 같은 유형 공시 직후(기준 봉 전날 종가 → 다음 거래일 종가)가 오른 비율(소수 4자리 내림, vsim-rules-v3). 정정 공시는 세지 않는다. 판정 전에는 null' }
              categoryDownShare: { type: number, nullable: true, minimum: 0, maximum: 1, description: '판정 뒤만. 같은 유형 공시 직후가 내린 비율(소수 4자리 내림). 보합은 오름·내림 어디에도 들지 않으므로 1 − categoryUpShare와 다를 수 있다. 판정 전에는 null' }
              categorySampleCount: { type: integer, nullable: true, minimum: 1, description: '판정 뒤만. categoryUpShare·categoryDownShare를 센 공시 수. 판정 전에는 null' }
              trend: { type: string, nullable: true, enum: [UP, DOWN, MIXED, null], description: '판정 뒤만. 그 유형의 경향(policies §8-6). vsim-rules-v3부터 공시 반응 측정 v2의 반응 창 근거 유형(공급 계약·자기주식 취득·시설·지분 투자)은 UP, 나머지는 MIXED로 고정한다(시장 조정 측정이라 categoryUpShare가 0.5 아래여도 UP일 수 있다). 판정 전에는 null' }
              trendOutcome: { type: string, nullable: true, enum: [CORRECT, INCORRECT, NEUTRAL, null], description: '늘 null(11-05 일반 세션 채점 없음, #253). 대회 판도 null. 유형의 경향은 trend로 본다' }
        notice: { type: string, description: '서버 고정 문장. 일반 세션은 isSample로 고르고, 대회 판(contest가 있음)은 대회 문장을 isSample로 고른다(결정 기록 2026-11-05-virtual-sim-contest 3-13). 실제 세션: 가상 종목·사건(실제 기업 아님), AI 생성·검수 없음, 실제 공시 제목 형식·글에 좋고 나쁨 없음, 채점하지 않음, 공시 직후·그다음 주 움직임과 유형 통계를 보임, 실제 시장 통계(수집 종목 5년 공시 전체)로 만든 가상 움직임(사건 날과 그 뒤 5거래일은 같은 유형 과거 공시 당일과 그 뒤 움직임, 시장 전체 몫을 빼지 않음), 표본 한계, 비권유, 세금/수수료/배당 제외. 예시 세션(isSample=true): AI·실제 시장 통계 문구 대신 정해진 틀의 예시 글·학습용 예시 통계라고 밝힌다. 문장은 결정 기록 2026-11-04-virtual-simulation 6. 대회 판: 가상 종목·사건(실제 기업 아님), AI 생성·검수 없음(예시면 정해진 틀), 대회 판은 채점하지 않고 판이 끝난 잔액·하루 목표 점수로만 겨룸, 실제 시장 통계(예시면 예시 통계)로 만든 가상 움직임, 표본 한계, 순위·점수는 수익을 뜻하지 않음, 비권유, 세금/수수료/배당 제외' }
        sources:
          type: array
          minItems: 1
          items: { type: string }
    VirtualSimContestRound:
      type: object
      additionalProperties: false
      description: '대회 판일 때만 VirtualSimSnapshot에 붙는다(policies §8-8). 일반 세션은 이 필드가 없다(null도 아님). 대회 판도 일반 세션처럼 채점이 없어 decisions[].outcome·trendOutcome이 늘 null이고 사건은 4개이며 notice는 대회 문장이다'
      required: [contestId, board, roundNumber, endBalance, holdBalance, holdReturnRate, excessRate]
      properties:
        contestId: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
        board: { allOf: [{ $ref: '#/components/schemas/VirtualContestBoard' }], description: '이 판의 판(출제 규칙의 기준). 판이 바뀌는 것은 주간 판정 때뿐이다' }
        roundNumber: { type: integer, minimum: 1 }
        endBalance: { type: integer, format: int64, minimum: 0, nullable: true, description: 'status=FINISHED일 때만 새 대회 잔액(= 마지막 portfolio.total). 그 전에는 null' }
        holdBalance: { type: integer, format: int64, minimum: 0, nullable: true, description: 'status=FINISHED일 때만 같은 판(같은 봉)을 사건마다 유지만 했을 때의 끝 잔액(첫 봉 시가 50% 최초 매수만). 그 전에는 null' }
        holdReturnRate: { type: number, nullable: true, description: 'status=FINISHED일 때만 유지만 했을 때의 수익률 = (holdBalance − initialAmount) / initialAmount(소수 4자리 내림). 내 판 수익률(portfolio.returnRate)과 비교해 보인다. 그 전에는 null' }
        excessRate: { type: number, nullable: true, description: 'status=FINISHED일 때만 이 판의 초과 수익률 = (endBalance − holdBalance) / initialAmount(소수 4자리 내림). 하루 점수는 그날 판들의 이 값 평균으로 정한다. 그 전에는 null' }
    VirtualContestRoundSnapshot:
      description: '대회 판 시작 응답의 snapshot. VirtualSimSnapshot에 contest가 반드시 있다'
      allOf:
        - $ref: '#/components/schemas/VirtualSimSnapshot'
        - type: object
          required: [contest]
          properties:
            contest: { $ref: '#/components/schemas/VirtualSimContestRound' }
    VirtualContestBoard:
      type: string
      enum: [B10M, B50M, B100M]
      description: '판(티어). 대회 시드머니 B10M 10,000,000 · B50M 50,000,000 · B100M 100,000,000원. 시작 판은 배치고사, 판은 주간 점수로 바뀐다(policies §8-8)'
    VirtualContest:
      type: object
      additionalProperties: false
      required: [contestId, startsAt, endsAt, weeks, boards, rules]
      properties:
        contestId: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$', description: '대회 이름 YYYY-MM' }
        startsAt: { type: string, format: date-time, description: '그달 1일 00:00+09:00' }
        endsAt: { type: string, format: date-time, description: '다음 달 1일 00:00+09:00(이 시각부터 마감)' }
        weeks:
          type: array
          minItems: 4
          maxItems: 4
          description: '주간 판정 구간. 1~7일, 8~14일, 15~21일, 22일~말일. 4주차는 대회 마지막 날 판정하고 판은 바꾸지 않는다(결과는 VirtualContestResult.finalWeek)'
          items:
            type: object
            additionalProperties: false
            required: [week, startsOn, endsOn]
            properties:
              week: { type: integer, minimum: 1, maximum: 4 }
              startsOn: { type: string, format: date }
              endsOn: { type: string, format: date }
        boards:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [board, seedMoney, volatilityGrades, participants, available]
            properties:
              board: { $ref: '#/components/schemas/VirtualContestBoard' }
              seedMoney: { type: integer, format: int64, description: '판의 대회 시드머니. 배치·승급·강등 때 잔액을 이 값으로 정한다' }
              volatilityGrades: { type: array, minItems: 1, maxItems: 3, items: { type: integer, minimum: 0, maximum: 2 }, description: '판에서 균등하게 뽑는 변동성 등급(B10M 0~1, B50M 0~2, B100M 1~2)' }
              participants: { type: integer, minimum: 0, description: '지금 이 판에 있는 참가자 수' }
              available: { type: boolean, description: '판에 맞는 후보 가상 종목이 있으면 true. false면 그 판의 판 시작이 503' }
        rules:
          type: object
          additionalProperties: false
          required: [roundsPerDay, roundsForDailyScore, eventsPerRound, dailyTargetRate, weeklyPromoteAt, weeklyDemoteAt, placementQuestions, placementCuts, liquidationBelow, rankingTop]
          properties:
            roundsPerDay: { type: integer, description: 'KST 하루 판 수(10)' }
            roundsForDailyScore: { type: integer, description: '하루 점수 +100을 받을 수 있는 판 수(10). 그날 이보다 적게 시작했으면 목표 이상이어도 0, 못 미치면 −100' }
            eventsPerRound: { type: integer, description: '한 판 사건 수(4)' }
            dailyTargetRate: { type: number, description: '하루 목표(0.01). 하루 수익률(그날 판들의 초과 수익률 평균, 초과 수익률 = (끝 잔액 − 같은 판을 유지만 했을 때 끝 잔액) / 시작 잔액)이 이상이면 +100, 못 미치면 −100. roundsForDailyScore판을 채우지 않은 날은 목표 이상 0·미만 −100, 판 없는 날 0. 점수는 100점 단위' }
            weeklyPromoteAt: { type: integer, description: '주 점수가 이 값 이상이면 승급(400)' }
            weeklyDemoteAt: { type: integer, description: '주 점수가 이 값 이하면 강등(−400)' }
            placementQuestions: { type: integer, description: '배치고사 문제 수(10)' }
            placementCuts:
              type: object
              additionalProperties: false
              description: '배치고사 맞힌 수가 이 값 이상이면 그 판(B50M 7, B100M 9). 그 아래는 B10M'
              required: [B50M, B100M]
              properties:
                B50M: { type: integer }
                B100M: { type: integer }
            liquidationBelow: { type: integer, format: int64, description: '판이 끝난 뒤 잔액이 이 값 미만이면 청산(1,000,000)' }
            rankingTop: { type: integer, description: '랭킹에 보이는 순위 수(100)' }
    VirtualContestPlacement:
      type: object
      additionalProperties: false
      description: '배치고사 문제(실제 과거 공시, 예시 자료면 예시 글). 회사명·날짜·정답·경향·가격·절대 금액·상대방 이름은 없다(회사명·날짜·정답·경향은 결과에서 공개). 결과(VirtualContestPlacementResult)에는 주요 내용·AI 요약을 다시 싣지 않으니 화면은 이 응답의 문제와 questionId로 잇는다'
      required: [placementId, expiresAt, basis, questions]
      properties:
        placementId: { type: string }
        expiresAt: { type: string, format: date-time, description: '시작 후 30분. 지나면 안 고른 문제를 틀림으로 서버가 채점' }
        basis: { type: string, enum: [REACTION, FIVE_DAY], description: '이 배치고사의 채점 기준(결과 items[].basis와 같음). REACTION = 공시 직후(기준 봉 전날 종가 → 다음 거래일 종가). FIVE_DAY = 11-09 반응 창 규칙 전에 시작해 저장된 배치고사의 5거래일(기준 봉 종가 → 5번째 후속 거래일 종가). 화면은 이 값으로 고를 기간을 안내한다' }
        questions:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [id, industry, category, categoryName, title, body, details, summary]
            properties:
              id: { type: string }
              industry: { type: string, description: '그 회사의 업종(회사명은 결과에서 공개)' }
              category: { $ref: '#/components/schemas/VirtualSimCategory' }
              categoryName: { type: string }
              title: { type: string, maxLength: 300, description: '실제 DART 공시 제목(예시 자료는 유형별 제목 형식). 정정 공시는 문제로 내지 않으므로 [기재정정] 같은 정정 접두어는 없다([첨부추가]·[연장결정]은 붙을 수 있다)' }
              body: { type: string, nullable: true, maxLength: 240, description: '실제 공시는 null(공시 원문은 저장하지 않는다. 주요 내용은 details, AI 요약은 summary), 예시 자료는 예시 글' }
              details:
                type: array
                nullable: true
                maxItems: 4
                description: '공시 주요 내용(policies §8-8 "공시 주요 내용"). OpenDART 주요사항보고서 주요정보에서 서버가 만든 비율(소수 1자리 내림)·규모 구간·정해 둔 분류 이름, 공급 계약(단일판매·공급계약체결)은 원문에서 뽑은 매출액 대비(%)·계약 기간 길이만 있고 회사·상대방 이름·날짜·절대 금액은 없다. 방향·과거 경향·상승 비율도 없다. 원공시에 없으면 합친 정정 공시의 값을 쓴다. 구조화 자료가 없는 유형(실적·배당·소송·최대주주 변경·신규시설투자·종속회사 공시 등)이거나 아직 받지 못했으면 null. 예시 자료는 예시 값(공급 계약은 null)'
                items:
                  type: object
                  additionalProperties: false
                  required: [label, value]
                  properties:
                    label: { type: string, maxLength: 20, description: '항목 이름(예: 새 주식 수(기존 대비))' }
                    value: { type: string, maxLength: 40, description: '값(예: 12.5%, 100억~500억 원, 주주배정 후 일반공모)' }
              summary:
                type: string
                nullable: true
                maxLength: 400
                description: '공시 AI 요약(policies §8-8 "공시 AI 요약", decisions/2026-11-09-placement-ai-summary). worker가 OpenDART 공시서류원본파일 본문 글을 AI로 요약하고 자동 검사를 통과한 2~5문장만 싣는다. 공시 사실과 사업 지표의 증감(실적 증감률 등)은 있고, 주가 방향·호재/악재 같은 평가·전망·과거 경향은 없다. 회사·상대방·사람 이름, 날짜, 절대 금액·주식 수·가격이 없고 숫자는 원문의 % 값·규모 구간 이름·기간 길이뿐이다. 사람이 검수하지 않았다. 아직 만들지 않았거나 검사에 걸렸거나 운영자가 숨겼으면 null(화면은 details·유형 설명을 쓴다). 예시 자료는 예시 글. 결과(VirtualContestPlacementResult)에는 다시 싣지 않는다'
    VirtualContestPlacementResult:
      type: object
      additionalProperties: false
      required: [placementId, correct, total, board, items, entry]
      properties:
        placementId: { type: string }
        correct: { type: integer, minimum: 0, maximum: 10 }
        total: { type: integer, description: '10' }
        board: { allOf: [{ $ref: '#/components/schemas/VirtualContestBoard' }], description: '배치된 시작 판' }
        items:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [questionId, prediction, company, date, basis, movement, reactionReturnRate, nextWeekReturnRate, subsequentReturnRate, correct, trend, categoryUpShare, categoryDownShare, categorySampleCount]
            properties:
              questionId: { type: string }
              prediction: { type: string, nullable: true, enum: [POSITIVE, NEGATIVE, null] }
              company: { type: string, description: '결과에서 공개하는 실제 회사 이름(예시 자료는 예시 회사)' }
              date: { type: string, format: date, nullable: true, description: '공시 접수일(예시 자료는 null)' }
              basis: { type: string, enum: [REACTION, FIVE_DAY], description: '채점 기준. REACTION = 반응 창(공시 직후, decisions/2026-11-09-placement-reaction-window). FIVE_DAY = 이 규칙 전에 시작한 배치고사의 5거래일 기준' }
              movement: { type: string, enum: [UP, DOWN], description: '정답 방향. REACTION이면 공시 직후(기준 봉 전날 종가 → 다음 거래일 종가), FIVE_DAY면 5거래일(기준 봉 종가 → 5번째 후속 거래일 종가)' }
              reactionReturnRate: { type: number, nullable: true, description: '공시 직후 실제 등락(기준 봉 전날 종가 → 다음 거래일 종가, 소수 4자리 내림). REACTION만, FIVE_DAY면 null' }
              nextWeekReturnRate: { type: number, nullable: true, description: '그다음 주 실제 등락(다음 거래일 종가 → 5번째 후속 거래일 종가, 소수 4자리 내림). 채점에 쓰지 않는다. REACTION만, FIVE_DAY면 null' }
              subsequentReturnRate: { type: number, nullable: true, description: '5거래일 실제 등락(기준 봉 종가 → 5번째 후속 거래일 종가, 소수 4자리 내림). FIVE_DAY만, REACTION이면 null' }
              correct: { type: boolean, description: 'movement가 UP이면 POSITIVE, DOWN이면 NEGATIVE가 맞음. null은 틀림' }
              trend: { type: string, nullable: true, enum: [UP, DOWN, MIXED, null], description: '그 유형의 경향(출제할 때의 룰셋, 룰셋에 없는 유형이면 null). 채점에는 쓰지 않는다. 아래 유형 통계와 함께 채점 구간과 같은 구간의 통계만 싣는다: REACTION이면 공시 직후 통계(vsim-rules-v3), FIVE_DAY면 5거래일 통계. 11-10 전 룰셋으로 출제한 REACTION 문제는 통계가 5거래일이라 4칸 모두 null(decisions/2026-11-10-vsim-ruleset-reaction-window)' }
              categoryUpShare: { type: number, nullable: true, minimum: 0, maximum: 1, description: '같은 유형 공시 중 오른 비율(구간은 trend 설명). 소수 4자리 내림' }
              categoryDownShare: { type: number, nullable: true, minimum: 0, maximum: 1, description: '같은 유형 공시 중 내린 비율. 소수 4자리 내림' }
              categorySampleCount: { type: integer, nullable: true, minimum: 1, description: '유형 통계를 센 공시 수' }
        entry: { $ref: '#/components/schemas/VirtualContestEntry' }
    VirtualContestEntry:
      type: object
      additionalProperties: false
      description: '이번 대회 내 기록. 금액·수익률·점수는 서버 계산(판 수익률은 지금 판 대회 시드머니 기준 소수 4자리 내림)'
      required: [contestId, alias, placement, board, seedMoney, balance, profit, returnRate, excessRate, boardPoints, week, today, rank, participants, rounds, activeRound, liquidated, lastBoardChange, joinedAt, recentRounds, scoredDays]
      properties:
        contestId: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
        alias: { type: string }
        placement:
          type: object
          additionalProperties: false
          required: [correct, board]
          properties:
            correct: { type: integer, minimum: 0, maximum: 10 }
            board: { $ref: '#/components/schemas/VirtualContestBoard' }
        board: { allOf: [{ $ref: '#/components/schemas/VirtualContestBoard' }], description: '지금 판' }
        seedMoney: { type: integer, format: int64, description: '지금 판의 대회 시드머니' }
        balance: { type: integer, format: int64, minimum: 0, description: '지금 대회 잔액(진행 중인 판은 시작 잔액)' }
        profit: { type: integer, format: int64, description: '잔액 − 지금 판 대회 시드머니' }
        returnRate: { type: number, description: '판 수익률' }
        excessRate: { type: number, nullable: true, description: '지금 판(참가 또는 마지막 승급·강등 뒤)에서 끝낸 판들의 평균 초과 수익률(초과 수익률 = (끝 잔액 − 같은 판을 유지만 했을 때 끝 잔액) / 시작 잔액, 소수 4자리 내림). 순위 2순위 기준이고 끝낸 판이 없으면 null(순위에서는 0으로 봄)' }
        boardPoints: { type: integer, description: '지금 판에 들어온 뒤 받은 하루 점수의 합(랭킹 기준, 100점 단위)' }
        week:
          type: object
          additionalProperties: false
          description: '이번 주 판정. 4주차(22일~말일)는 대회 마지막 날 판정만 기록하고 판은 바꾸지 않는다'
          required: [week, endsOn, points]
          properties:
            week: { type: integer, minimum: 1, maximum: 4 }
            endsOn: { type: string, format: date }
            points: { type: integer, description: '이번 주에 정해진 하루 점수의 합(+400 이상 승급, −400 이하 강등)' }
        today:
          type: object
          additionalProperties: false
          description: '오늘(KST) 진행'
          required: [startBalance, returnRate, targetRate, rounds, roundsLeft]
          properties:
            startBalance: { type: integer, format: int64, nullable: true, description: '오늘 첫 판의 시작 잔액. 오늘 판이 없으면 null' }
            returnRate: { type: number, nullable: true, description: '오늘 수익률 = 오늘 시작해 지금까지 끝난 판들의 초과 수익률(유지만 했을 때 대비) 평균(소수 4자리 내림, 확정은 하루가 끝난 뒤). 오늘 끝난 판이 없으면 null' }
            targetRate: { type: number, description: '하루 목표(0.01, 초과 수익률 평균 기준)' }
            rounds: { type: integer, minimum: 0, maximum: 10 }
            roundsLeft: { type: integer, minimum: 0, maximum: 10 }
        rank: { type: integer, minimum: 1, description: '지금 판 안 순위' }
        participants: { type: integer, minimum: 1, description: '지금 판의 참가자 수' }
        rounds: { type: integer, minimum: 0, description: '이번 대회에서 끝낸 판 수' }
        activeRound: { type: boolean, description: '진행 중인 판이 있으면 true. 새 판을 시작하면 그 판은 남은 사건 유지로 정산된다' }
        liquidated: { type: boolean, description: '잔액이 1,000,000원 미만으로 끝나 이번 대회를 더 할 수 없음' }
        lastBoardChange:
          type: object
          nullable: true
          additionalProperties: false
          description: '이번 시즌의 마지막 승급·강등(주간 판정). 없으면 null'
          required: [from, to, weekPoints, at]
          properties:
            from: { $ref: '#/components/schemas/VirtualContestBoard' }
            to: { $ref: '#/components/schemas/VirtualContestBoard' }
            weekPoints: { type: integer }
            at: { type: string, format: date-time }
        joinedAt: { type: string, format: date-time }
        recentRounds:
          type: array
          maxItems: 30
          description: '이번 대회에서 시작한 판, 최신순 최대 30개(본인만). 진행 중인 판은 끝 잔액·수익률이 null'
          items: { $ref: '#/components/schemas/VirtualContestRoundRecord' }
        scoredDays:
          type: array
          maxItems: 31
          description: '하루 점수를 정한 날, 최신순(본인만). 판을 안 한 날은 점수 0·수익률 null'
          items:
            type: object
            additionalProperties: false
            required: [date, board, rounds, excessRate, points]
            properties:
              date: { type: string, format: date }
              board: { $ref: '#/components/schemas/VirtualContestBoard' }
              rounds: { type: integer, minimum: 0, description: '그날 시작한 판 수' }
              excessRate: { type: number, nullable: true, description: '그날 판들의 초과 수익률 평균(하루 수익률). 판이 없으면 null' }
              points: { type: integer, minimum: -100, maximum: 100, description: '하루 점수(+100·0·−100)' }
    VirtualContestRoundRecord:
      type: object
      additionalProperties: false
      description: '내 판 하나의 결과. 금액·수익률은 서버 계산(소수 4자리 내림)'
      required: [roundNumber, board, date, status, endReason, startBalance, endBalance, holdBalance, returnRate, holdReturnRate, excessRate, startedAt, endedAt]
      properties:
        roundNumber: { type: integer, minimum: 1 }
        board: { $ref: '#/components/schemas/VirtualContestBoard' }
        date: { type: string, format: date, description: '판을 시작한 KST 날짜(하루 점수의 그날)' }
        status: { type: string, enum: [ACTIVE, SETTLED] }
        endReason: { type: string, nullable: true, enum: [COMPLETED, ENDED, EXPIRED, RESTARTED, REPLACED, CLOSED, null], description: 'COMPLETED 완주, ENDED 그만둠, EXPIRED 30분 만료, RESTARTED 서버 재시작, REPLACED 새 판 시작, CLOSED 대회 마감. 진행 중이면 null' }
        startBalance: { type: integer, format: int64, minimum: 0 }
        endBalance: { type: integer, format: int64, minimum: 0, nullable: true }
        holdBalance: { type: integer, format: int64, minimum: 0, nullable: true, description: '같은 판을 사건마다 유지만 했을 때 끝 잔액. 진행 중이거나 이 값이 생기기 전에 끝난 판은 null' }
        returnRate: { type: number, nullable: true, description: '내 판 수익률 (endBalance − startBalance) / startBalance' }
        holdReturnRate: { type: number, nullable: true, description: '유지만 했을 때 수익률 (holdBalance − startBalance) / startBalance' }
        excessRate: { type: number, nullable: true, description: '초과 수익률(매매 성과) (endBalance − holdBalance) / startBalance' }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time, nullable: true }
    VirtualContestRanking:
      type: object
      additionalProperties: false
      required: [contestId, board, status, participants, items, me]
      properties:
        contestId: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
        board: { $ref: '#/components/schemas/VirtualContestBoard' }
        status: { type: string, enum: [OPEN, SETTLED], description: 'OPEN이면 지금 그 판에 있는 참가자의 지금 순위, SETTLED면 마지막 판 기준 확정 순위' }
        participants: { type: integer, minimum: 0 }
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/VirtualContestRankingRow' } }
        me: { anyOf: [{ $ref: '#/components/schemas/VirtualContestRankingRow' }, { nullable: true, enum: [null] }], description: '내 행(100위 밖이어도). 지금(정산 뒤면 마지막에) 이 판에 없으면 null' }
    VirtualContestRankingRow:
      type: object
      additionalProperties: false
      description: '다른 회원에게는 별명과 아래 값만 보인다(이메일·회원 번호 없음)'
      required: [rank, alias, boardPoints, excessRate, balance, profit, returnRate, rounds, liquidated, isMe]
      properties:
        rank: { type: integer, minimum: 1 }
        alias: { type: string }
        boardPoints: { type: integer, description: '판 점수(순위 1순위 기준)' }
        balance: { type: integer, format: int64, minimum: 0 }
        profit: { type: integer, format: int64, description: '잔액 − 판 대회 시드머니' }
        excessRate: { type: number, nullable: true, description: '지금 판(참가 또는 마지막 승급·강등 뒤)에서 끝낸 판들의 평균 초과 수익률(초과 수익률 = (끝 잔액 − 같은 판을 유지만 했을 때 끝 잔액) / 시작 잔액, 소수 4자리 내림). 순위 2순위 기준이고 끝낸 판이 없으면 null(순위에서는 0으로 봄)' }
        returnRate: { type: number, description: '판 수익률(잔액 기준, 순위에는 쓰지 않음)' }
        rounds: { type: integer, minimum: 0 }
        liquidated: { type: boolean }
        isMe: { type: boolean }
    VirtualContestResult:
      type: object
      additionalProperties: false
      description: '정산한 지난 대회의 내 결과(마지막 판 기준). 판별 상위 비율 보상은 별도 Issue(결정 기록 8)'
      required: [contestId, placementBoard, finalBoard, highestBoard, boardPoints, balance, profit, returnRate, excessRate, rank, participants, rounds, liquidated, finalWeek]
      properties:
        contestId: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
        placementBoard: { allOf: [{ $ref: '#/components/schemas/VirtualContestBoard' }], description: '배치고사로 시작한 판' }
        finalBoard: { allOf: [{ $ref: '#/components/schemas/VirtualContestBoard' }], description: '시즌이 끝났을 때의 판(순위를 매긴 판)' }
        highestBoard: { allOf: [{ $ref: '#/components/schemas/VirtualContestBoard' }], description: '그 시즌에 가장 높이 오른 판' }
        boardPoints: { type: integer }
        balance: { type: integer, format: int64, minimum: 0 }
        profit: { type: integer, format: int64 }
        returnRate: { type: number }
        excessRate: { type: number, nullable: true, description: 'finalBoard에서 끝낸 판들의 평균 초과 수익률(순위 2순위 기준). 판이 없으면 null' }
        rank: { type: integer, minimum: 1, description: 'finalBoard 안 확정 순위' }
        participants: { type: integer, minimum: 1, description: 'finalBoard의 확정 참가자 수' }
        rounds: { type: integer, minimum: 0 }
        liquidated: { type: boolean }
        finalWeek:
          type: object
          nullable: true
          additionalProperties: false
          description: '마지막 주(22일~말일) 판정. 판은 바꾸지 않아 finalBoard·rank·highestBoard에는 반영되지 않는다. 판정 기록이 없으면(이 규칙 전에 정산한 대회) null'
          required: [points, result]
          properties:
            points: { type: integer, description: '마지막 주 하루 점수의 합' }
            result: { type: string, enum: [PROMOTE, DEMOTE, STAY], description: 'PROMOTE 승급 기준 도달(+400 이상, 1억 판 제외), DEMOTE 강등 기준 도달(−400 이하, 1천만 판 제외), STAY 그 밖' }
    GoalScenarioProductType:
      type: string
      enum: [SAVINGS, CMA, KR_INDEX_ETF, US_INDEX_ETF, KOSPI_TOP5]
      description: 'SAVINGS 적금, CMA, KR_INDEX_ETF 국내 대표 지수 ETF, US_INDEX_ETF 미국 대표 지수 ETF(국내 상장), KOSPI_TOP5 코스피 시가총액 상위 5종목 같은 비중. 고르는 규칙은 policies §7-2'
    GoalScenarioProduct:
      type: object
      required: [type, items, ratePercent, isSample, alternatives, termMonths]
      additionalProperties: false
      properties:
        type: { $ref: '#/components/schemas/GoalScenarioProductType' }
        items:
          type: array
          minItems: 1
          description: 'KOSPI_TOP5는 5개, CMA는 이름만(code null), 나머지 1개'
          items:
            type: object
            required: [code, name, company]
            additionalProperties: false
            properties:
              code: { type: string, nullable: true, description: '종목 코드 또는 적금 상품 id' }
              name: { type: string }
              company: { type: string, nullable: true, description: '적금 금융회사. 그 밖에는 null' }
        ratePercent: { type: string, nullable: true, description: '적금 기본금리·CMA 예시 금리(예: "3.50"). 투자 유형은 null' }
        isSample: { type: boolean, description: 'CMA 예시 금리면 true' }
        termMonths: { type: integer, nullable: true, description: '적금 만기 개월(기한 이하, 함께 볼 상품도 같은 만기). 기한보다 짧으면 만기 뒤 남은 달은 CMA 예시 금리로 계산했다. 적금이 아니면 null' }
        alternatives:
          type: array
          maxItems: 2
          description: '함께 볼 상품(policies §7-2). 금액 계산에 쓰지 않는다. 적금·지수 ETF만 있고 CMA·KOSPI_TOP5와 #309 이전 저장본은 빈 배열'
          items:
            type: object
            required: [code, name, company, ratePercent]
            additionalProperties: false
            properties:
              code: { type: string, description: '종목 코드 또는 적금 상품 id' }
              name: { type: string }
              company: { type: string, nullable: true, description: '적금 금융회사. 그 밖에는 null' }
              ratePercent: { type: string, nullable: true, description: '적금 기본금리(예: "3.20"). 지수 ETF는 null' }
    GoalScenarioResult:
      type: object
      required: [resultId, name, targetAmount, months, monthlyBudget, proposer, fallbackReason, asOf, returnsFrom, returnsTo, paths, seed, reachShare, products, scenarios, assumptions, notice, isSample, aiUsage, aiReused]
      additionalProperties: false
      properties:
        resultId: { type: string, description: '이 결과를 저장할 때 쓰는 값. 서버가 30분 동안만 기억한다(policies §7-8)' }
        name: { type: string }
        targetAmount: { type: integer, format: int64 }
        months: { type: integer, description: '기한(개월, 6~60)' }
        monthlyBudget: { type: integer, format: int64, nullable: true, description: '요청의 월 납입 가능액. 넣지 않았으면 null' }
        proposer: { type: string, enum: [AI, DEMO], description: 'DEMO면 화면에 "AI 연결 전 예시 조합" 표시' }
        fallbackReason: { type: string, nullable: true, enum: [AI_UNAVAILABLE, GUEST, LIMIT, DAILY_CAP, AI_FAILED, AI_REJECTED, null], description: 'proposer=DEMO일 때 이유(policies §7-6). AI_UNAVAILABLE 키 없음, GUEST 비회원, LIMIT 회원 하루 횟수 소진, DAILY_CAP 서비스 전체 하루 상한, AI_FAILED 호출 실패, AI_REJECTED 규칙 위반. AI면 null' }
        asOf: { type: string, format: date, description: '자료 기준일(수집된 마지막 거래일)' }
        returnsFrom: { type: string, description: 'YYYY-MM. 수익률 자료 첫 달' }
        returnsTo: { type: string, description: 'YYYY-MM. 수익률 자료 마지막 달' }
        paths: { type: integer, description: '경로 수(2000)' }
        seed: { type: integer, format: int64 }
        reachShare: { type: number, description: '필요 월 금액의 기준 비율(0.8 = 10번 중 8번)' }
        products:
          type: array
          description: 이번 계산에 쓴 상품 유형별 실제 상품(쓰지 않은 유형도 포함)
          items: { $ref: '#/components/schemas/GoalScenarioProduct' }
        scenarios:
          type: array
          minItems: 3
          maxItems: 3
          items: { $ref: '#/components/schemas/GoalScenario' }
        assumptions: { type: array, items: { type: string }, description: '세금·배당·수수료·리밸런싱·CMA 예시 금리 등 계산 가정' }
        notice: { type: string, description: '고지 GOAL_SCENARIO_EST(추정·비보장·원금 손실·기준일 확인)' }
        isSample: { type: boolean, description: '예시 값(CMA 예시 금리 또는 데모 조합)이 하나라도 있으면 true' }
        aiUsage:
          type: object
          nullable: true
          description: '회원의 AI 조합 횟수(KST 하루). 비회원이면 null'
          required: [limitPerDay, remainingToday]
          additionalProperties: false
          properties:
            limitPerDay: { type: integer }
            remainingToday: { type: integer }
        aiReused: { type: boolean, description: '같은 회원이 같은 목표 금액·기한·월 납입 가능액(없음끼리 같음)·자료 기준일로 받은 이전 AI 조합을 다시 썼으면 true(횟수 차감 없음). 그 밖에는 false' }
    SavedGoalScenarioSummary:
      type: object
      required: [id, savedAt, name, targetAmount, months, asOf, title, reachable, monthly, kind]
      additionalProperties: false
      properties:
        id: { type: integer, format: int64 }
        savedAt: { type: string, format: date-time }
        name: { type: string }
        targetAmount: { type: integer, format: int64 }
        months: { type: integer, description: '기한(개월)' }
        asOf: { type: string, format: date, description: '저장한 결과의 자료 기준일' }
        title: { type: string, description: '저장한 시나리오 제목' }
        reachable: { type: boolean }
        monthly: { type: integer, format: int64, nullable: true }
        kind: { type: string, nullable: true, enum: [FIXED, RANGE, null] }
    SavedGoalScenario:
      type: object
      required: [id, savedAt, name, targetAmount, months, monthlyBudget, proposer, asOf, returnsFrom, returnsTo, paths, reachShare, products, scenario, alternatives, assumptions, notice, isSample]
      additionalProperties: false
      description: '저장할 때의 계산 결과 그대로(다시 계산하지 않음). 화면은 "기준일 결과"로 보여 준다'
      properties:
        id: { type: integer, format: int64 }
        savedAt: { type: string, format: date-time }
        name: { type: string }
        targetAmount: { type: integer, format: int64 }
        months: { type: integer, description: '기한(개월)' }
        monthlyBudget: { type: integer, format: int64, nullable: true, description: '저장할 때 넣은 월 납입 가능액. 넣지 않았거나 #399 전 저장본이면 null' }
        proposer: { type: string, enum: [AI, DEMO] }
        asOf: { type: string, format: date }
        returnsFrom: { type: string }
        returnsTo: { type: string }
        paths: { type: integer }
        reachShare: { type: number }
        products: { type: array, items: { $ref: '#/components/schemas/GoalScenarioProduct' } }
        scenario: { $ref: '#/components/schemas/GoalScenario' }
        alternatives:
          type: array
          description: 'scenario(저장할 때 고른 플랜, 먼저 보여 줌)를 뺀 같은 계산 결과의 나머지 플랜(결과 순서). 플랜 하나만 저장하던 때의 저장본은 빈 배열'
          items: { $ref: '#/components/schemas/GoalScenario' }
        assumptions: { type: array, items: { type: string } }
        notice: { type: string }
        isSample: { type: boolean }
    GoalScenario:
      type: object
      required: [id, title, summary, explanation, explanationParts, resultText, mix, reachable, monthly, paid, outcome, withinBudget, overBudgetBy]
      additionalProperties: false
      properties:
        id: { type: string }
        title: { type: string, maxLength: 20 }
        summary: { type: string, maxLength: 40 }
        explanation: { type: string, description: '제안기 해설. explanationParts의 빈 칸이 아닌 칸을 문단으로 합친 값(문단 사이 줄바꿈). 글자 수 제한 없음. 숫자는 서버가 확인할 수 있는 것만, 보장 단정 없음(§7-6). explanationParts가 null인 옛 데이터는 이 값만 보여 준다' }
        explanationParts:
          type: object
          nullable: true
          description: '해설 네 칸(policies §7-6). 걸린 문장을 지워 빈 칸은 ""(화면에서 그 소제목을 숨김). 11-10 배포 전 재사용 조합과 옛 저장본은 null'
          required: [reason, roles, comparison, fit]
          additionalProperties: false
          properties:
            reason: { type: string, description: '조합 이유' }
            roles: { type: string, description: '유형별 역할과 근거' }
            comparison: { type: string, description: '다른 시나리오와의 차이' }
            fit: { type: string, description: '주의할 점과 맞는 사람' }
        resultText: { type: string, description: '서버가 정해 둔 문장에 이 시나리오의 계산값을 넣은 결과 문장(policies §7-5). 표기는 내림. 저장본은 조회할 때 저장된 숫자로 만든다' }
        mix:
          type: array
          minItems: 1
          description: 비중이 0보다 큰 유형만, 비중 합 100
          items:
            type: object
            required: [type, ratioPercent, monthly]
            additionalProperties: false
            properties:
              type: { $ref: '#/components/schemas/GoalScenarioProductType' }
              ratioPercent: { type: integer, minimum: 1, maximum: 100 }
              monthly: { type: integer, format: int64, nullable: true, description: '유형별 월 금액. reachable=false면 null' }
        reachable: { type: boolean, description: '목표 금액 이하의 월 금액으로 기준 비율을 채울 수 있는지' }
        monthly: { type: integer, format: int64, nullable: true, description: '필요 월 금액(천 원 단위 올림)' }
        paid: { type: integer, format: int64, nullable: true, description: '넣은 돈 = monthly × months' }
        outcome:
          type: object
          nullable: true
          description: 'reachable=false면 null'
          required: [kind, fixedAmount, low, median, high, chanceBp, lossBp]
          additionalProperties: false
          properties:
            kind: { type: string, enum: [FIXED, RANGE], description: 'FIXED 적금·CMA만(결과 하나), RANGE 투자 포함' }
            fixedAmount: { type: integer, format: int64, nullable: true, description: 'FIXED일 때 기한 말 금액' }
            low: { type: integer, format: int64, nullable: true, description: 'RANGE 하위 10%' }
            median: { type: integer, format: int64, nullable: true, description: 'RANGE 중간값' }
            high: { type: integer, format: int64, nullable: true, description: 'RANGE 상위 10%' }
            chanceBp: { type: integer, description: '목표에 닿은 경로 비율(만분율, 내림)' }
            lossBp: { type: integer, description: '기한 말 금액 < 넣은 돈인 경로 비율(만분율, 내림)' }
        withinBudget: { type: boolean, nullable: true, description: '필요 월 금액이 월 납입 가능액 이하면 true, 넘거나 월 금액을 찾지 못했으면(reachable=false) false. 가능액을 넣지 않았거나 #399 전 저장본이면 null(policies §7-5)' }
        overBudgetBy: { type: integer, format: int64, nullable: true, description: '필요 월 금액 − 월 납입 가능액(withinBudget=false이고 reachable=true일 때만, 천 원 단위). 그 밖에는 null' }
    Error:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          enum: [VALIDATION_FAILED, UNAUTHORIZED, INVALID_CREDENTIALS, SOCIAL_ACCOUNT, OAUTH_CODE_INVALID, NOT_FOUND,
            GOAL_CHANGED, EMAIL_UNAVAILABLE, TOO_MANY_ATTEMPTS, MARKET_UNAVAILABLE, LINK_CODE_INVALID, APP_LINK_EXISTS,
            APP_LINK_IN_PROGRESS, APP_LINK_RESULT_UNKNOWN, APP_UNAVAILABLE, INTERNAL_ERROR,
            PRACTICE_CONFLICT, PRACTICE_EXPIRED, PRACTICE_UNAVAILABLE, PRACTICE_CAPACITY, GOAL_SCENARIO_LIMIT, GOAL_SCENARIO_EXPIRED,
            CONTEST_CLOSED, CONTEST_NOT_JOINED, CONTEST_ALREADY_JOINED, CONTEST_LIQUIDATED, CONTEST_DAILY_LIMIT]
        message: { type: string }
