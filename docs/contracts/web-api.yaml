        summary: { type: string, nullable: true, description: '나이 외 조건 요약' }
        ageMin: { type: integer, nullable: true }
        ageMax: { type: integer, nullable: true }
        incomeLimit: { type: boolean, nullable: true, description: '원문에 소득 기준이 있으면 true, 언급이 없으면 null' }
        employment: { type: array, nullable: true, items: { type: string }, description: '취업 상태(재직자·자영업자·미취업자·프리랜서·일용근로자·(예비)창업자·단기근로자·영농종사자·기타)' }
        marital: { type: array, nullable: true, items: { type: string }, description: '혼인(기혼·미혼)' }
        schools: { type: array, nullable: true, items: { type: string }, description: '학력(고졸 미만·고교 재학·고졸 예정·고교 졸업·대학 재학·대졸 예정·대학 졸업·석·박사·기타)' }
        majors: { type: array, nullable: true, items: { type: string }, description: '전공(인문계열·사회계열·상경계열·이학계열·공학계열·예체능계열·농산업계열·기타)' }
        special: { type: array, nullable: true, items: { type: string }, description: '특화 대상(중소기업·여성·기초생활수급자·한부모가정·장애인·농업인·군인·지역인재·기타)' }
