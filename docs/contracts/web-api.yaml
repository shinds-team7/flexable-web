      properties:
        type: { type: string, enum: [DART] }
        externalId: { type: string }
        title: { type: string }
        publisher: { type: string, nullable: true }
        date: { type: string, format: date }
        url: { type: string }
        weight: { type: integer }
    EventDetail:
      type: object
      required: [id, code, name, scope, startDate, endDate, windowDays, direction, headline, marketReaction, afterwards,
        sources, newsSearchUrl, whatHappened, whyItMoved, aiGenerated, confidence, noticeKey, notice]
      additionalProperties: false
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, nullable: true }
        name: { type: string, nullable: true }
        scope: { type: string, enum: [STOCK, MARKET] }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        windowDays: { type: integer }
        direction: { type: string, enum: [RISE, FALL] }
        headline: { type: string }
        marketReaction:
          type: object
          required: [returnRate, marketReturn, volumeRatio, weekReturn]
          additionalProperties: false
          properties:
            returnRate: { type: number }
            marketReturn: { type: number, nullable: true }
            volumeRatio: { type: number, nullable: true }
            weekReturn: { type: number, nullable: true }
        afterwards:
          type: object
          required: [d30, d365]
          additionalProperties: false
          properties:
            d30: { type: number, nullable: true }
            d365: { type: number, nullable: true }
        sources: { type: array, items: { $ref: '#/components/schemas/EvidenceRow' } }
        newsSearchUrl: { type: string, nullable: true }
        whatHappened: { type: string }
        whyItMoved: { type: array, items: { type: object } }
        aiGenerated: { type: boolean }
        confidence: { type: string, enum: [LOW, MEDIUM, HIGH] }
        noticeKey: { type: string, enum: [EVENT_EXPLAIN] }
        notice: { type: string }

    PricePeriod:
      type: string
      enum: ['3M', '6M', '1Y', '3Y']
      default: '3M'
    SourceRow:
      type: object
      required: [name, note]
      additionalProperties: false
      properties:
        name: { type: string }
        note: { type: string, nullable: true }
    PriceSeries:
      type: object
      required: [id, name, kind, period, startDate, endDate, dataAsOf, basis, points, sources, noticeKey, notice, isSample]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [STOCK, ETF] }
        period: { $ref: '#/components/schemas/PricePeriod' }
        startDate: { type: string, format: date, description: '실제 첫 거래일' }
        endDate: { type: string, format: date }
        dataAsOf: { type: string, format: date }
        basis: { type: string, enum: [DAILY_ADJ_CLOSE], description: '수정주가 일별 종가' }
