            isSample: { type: boolean, description: '키 없이 예시 작성기(EVENT_OVERVIEW_SOURCE=fake)가 쓴 문장' }
        confidence: { type: string, enum: [LOW, MEDIUM, HIGH] }
        noticeKey: { type: string, enum: [EVENT_EXPLAIN] }
        notice: { type: string }

