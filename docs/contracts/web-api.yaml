openapi: 3.0.3
info:
  title: 텅장관리 웹 API
  version: 1.0.0
  description: |
    브라우저(웹 프론트) ↔ 웹 백엔드(Spring) 계약. 이 파일이 정본이다.
    - 백엔드 `ContractTest`가 실제 응답을 이 스펙으로 검사한다(정의되지 않은 필드도 실패).
    - 프론트 타입은 `npm run gen:api`로 `src/lib/api-schema.d.ts`에 만들고, 목 서버는 `npm run mock:api`.
    - 바꿀 때는 구현보다 먼저 이 파일을 고치는 PR(`spec-change` 라벨 + docs/CHANGELOG.md)을 올린다.
    - 금액은 원 단위 정수, 비율·수익률은 소수(0.05 = 5%), 시각은 +09:00이 붙은 ISO-8601이다.
    - 웹 백엔드가 부르는 앱 서버 `/internal/v1/web-links/*`는 앱 저장소 `docs/contracts/web-link-api.yaml`이 정본이다.
servers:
  - url: /api/v1
security:
  - bearer: []
tags:
  - name: auth
  - name: user
  - name: seed-money
  - name: app-link
  - name: goal
  - name: market
  - name: simulation
  - name: practice
    description: '사건 퀴즈 투자 시뮬레이션(#88 구현). 기존 simulation과 별도이며 policies §5 적용'
  - name: youth-news
  - name: health

paths:
  /practice/categories:
    get:
      tags: [practice]
      summary: '구현 예정: 준비된 업종과 후보 종목 수'
      security: []
      responses:
        '200':
          description: '후보가 없으면 categories는 빈 배열. 키움 업종명 정규화와 내부 코드 생성은 결정 기록 참조'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [categories, isSample]
                properties:
                  isSample: { type: boolean }
                  categories:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [code, name, classificationVersion, eligibleCount]
                      properties:
                        code: { type: string }
                        name: { type: string }
                        classificationVersion: { type: string }
                        eligibleCount: { type: integer, minimum: 1 }
        '503': { $ref: '#/components/responses/Error' }
  /practice/start:
    post:
      tags: [practice]
      summary: '구현 예정: 무작위 종목 선정, 최초 매수와 첫 봉. 로그인·영구 저장 없음'
      description: '동일 startId와 동일 입력은 세션 생존 중 같은 시작 응답. 같은 ID·다른 입력은 409. 종료·만료 후 같은 ID는 새 실행이다. 성공 응답은 no-store. 동시 재전송도 세션 하나만 생성한다.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [startId, categoryCode, initialAmount]
              properties:
                startId: { type: string, format: uuid }
                categoryCode: { type: string, minLength: 1, maxLength: 32 }
                initialAmount: { type: integer, format: int64, minimum: 10000, maximum: 100000000 }
      responses:
        '200':
          description: 'version=0, 첫 봉만 공개. sessionToken은 256비트 이상 임의 토큰, expiresAt은 시작 후 30분'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [sessionToken, expiresAt, snapshot]
                properties:
                  sessionToken: { type: string, minLength: 43, maxLength: 128 }
                  expiresAt: { type: string, format: date-time }
                  snapshot: { $ref: '#/components/schemas/PracticeSnapshot' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /practice/state:
    post:
      tags: [practice]
      summary: '구현 예정: 현재까지의 상태만 재조회(no-store)'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PracticeToken' }
      responses:
        '200':
          description: 현재 상태
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PracticeSnapshot' }
        '400': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
  /practice/step:
    post:
      tags: [practice]
      summary: '구현 예정: 다음 멈춤까지 진행(no-store)'
      description: 'RUNNING에서만 진행. 다음 사건이 나오는 거래일 또는 마지막 봉까지 한 번에 진행하고 version은 1 증가. 문제에서 멈추거나 끝났으면 409. 같은 commandId·같은 본문 재전송은 원래 응답을 반환'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PracticeCommand' }
      responses:
        '200':
          description: 새 봉까지의 상태. 이후 가격·사건·정답은 제외
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PracticeSnapshot' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
  /practice/decision:
    post:
      tags: [practice]
      summary: '구현 예정: 현재 사건의 방향 예상과 가상 매매 선택(no-store)'
      description: 'AWAITING_DECISION의 eventId만 허용. 선택을 기록하고 RUNNING으로 바꾸며 version 증가. 봉은 아직 진행하지 않고 다음 step에서 시가 체결'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sessionToken, commandId, expectedVersion, eventId, prediction, action, allocationPercent]
              properties:
                sessionToken: { type: string, minLength: 43, maxLength: 128 }
                commandId: { type: string, format: uuid }
                expectedVersion: { type: integer, minimum: 0 }
                eventId: { type: string }
                prediction: { type: string, enum: [POSITIVE, NEGATIVE] }
                action: { type: string, enum: [BUY, SELL, HOLD] }
                allocationPercent: { type: integer, enum: [0, 25, 50, 100], description: 'HOLD는 0만, BUY/SELL은 25/50/100만 허용' }
      responses:
        '200':
          description: 선택을 접수한 상태. 판정 전 정답은 없음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PracticeSnapshot' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
  /practice/end:
    post:
      tags: [practice]
      summary: '구현 예정: 세션 즉시 삭제. 없는 토큰·반복 종료도 204'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PracticeToken' }
      responses:
        '204': { description: 삭제 완료 }
        '400': { $ref: '#/components/responses/Error' }
  /auth/signup:
    post:
      tags: [auth]
      summary: 웹 이메일 가입
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, agreeTerms]
              properties:
                email: { type: string, maxLength: 254 }
                password: { type: string, minLength: 8, maxLength: 64, description: '영문과 숫자를 모두 포함' }
                agreeTerms: { type: boolean, description: 'true여야 한다' }
      responses:
        '201': { $ref: '#/components/responses/Auth' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      tags: [auth]
      summary: 웹 이메일 로그인
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Auth' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      tags: [auth]
      summary: 이 회원의 웹 토큰을 모든 기기에서 폐기
      responses:
        '204': { description: '폐기함' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/oauth/providers:
    get:
      tags: [auth]
      summary: 설정된 소셜 로그인 공급자
      security: []
      responses:
        '200':
          description: 공급자 목록
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                additionalProperties: false
                properties:
                  providers:
                    type: array
                    items: { type: string, enum: [kakao, google] }
  /auth/oauth/{provider}/start:
    get:
      tags: [auth]
      summary: 공급자 로그인으로 이동(PKCE S256)
      security: []
      parameters:
        - $ref: '#/components/parameters/Provider'
        - { name: redirectUri, in: query, required: true, schema: { type: string } }
        - { name: codeChallenge, in: query, required: true, schema: { type: string } }
      responses:
        '302': { description: '공급자 로그인 화면 또는 redirectUri?error=' }
  /auth/oauth/{provider}/callback:
    get:
      tags: [auth]
      summary: 공급자가 부르는 콜백
      security: []
      parameters:
        - $ref: '#/components/parameters/Provider'
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        '302': { description: 'redirectUri?code=(2분, 한 번) 또는 ?error=cancelled|provider_unavailable|email_in_use|failed' }
  /auth/oauth/exchange:
    post:
      tags: [auth]
      summary: 콜백 code를 웹 토큰으로 교환
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, codeVerifier]
              properties:
                code: { type: string }
                codeVerifier: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Auth' }
        '401': { $ref: '#/components/responses/Error' }

  /me:
    get:
      tags: [user]
      summary: 내 웹 계정
      responses:
        '200':
          description: 계정
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Error' }
    delete:
      tags: [user]
      summary: 웹 탈퇴(이메일 계정은 password, 소셜이 붙은 계정은 confirm="탈퇴"). 비밀번호가 틀리면 401 INVALID_CREDENTIALS
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string }
                confirm: { type: string }
      responses:
        '204': { description: '탈퇴함' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /me/settings:
    get:
      tags: [user]
      summary: 화면 설정
      responses:
        '200': { $ref: '#/components/responses/Settings' }
        '401': { $ref: '#/components/responses/Error' }
    patch:
      tags: [user]
      summary: 보낸 필드만 바꾼다(seenTours는 병합, disclaimerAck=true는 서버 시각 기록)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                theme: { type: string, enum: [light, dark] }
                seenTours:
                  type: array
                  maxItems: 24
                  items: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,39}$' }
                disclaimerAck: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/Settings' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /me/seed-money:
    get:
      tags: [seed-money]
      summary: 웹 시드머니(앱 연동 값 + 직접 수정 값). 적용 규칙은 docs/policies.md §1
      responses:
        '200': { $ref: '#/components/responses/SeedMoney' }
        '401': { $ref: '#/components/responses/Error' }
  /me/seed-money/manual:
    put:
      tags: [seed-money]
      summary: 직접 고친 시드머니 저장(0~10억 원 정수, 덮어쓰기)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [total]
              properties:
                total: { type: integer, format: int64, minimum: 0, maximum: 1000000000 }
      responses:
        '200': { $ref: '#/components/responses/SeedMoney' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
    delete:
      tags: [seed-money]
      summary: 직접 고친 값을 지우고 앱 기록 기준으로(없어도 204)
      responses:
        '204': { description: '지움' }
        '401': { $ref: '#/components/responses/Error' }

  /app-link:
    get:
      tags: [app-link]
      summary: 연동 상태(저장한 마지막 값, 앱 서버를 부르지 않음)
      responses:
        '200': { $ref: '#/components/responses/AppLink' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [app-link]
      summary: 앱에서 받은 6자리 코드로 연동
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, maxLength: 20, pattern: '^[A-Za-z0-9 -]*$' }
      responses:
        '201': { $ref: '#/components/responses/AppLink' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      tags: [app-link]
      summary: 연동 해제(앱 서버 장애면 503이고 연동은 남음)
      responses:
        '204': { description: '해제함' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /app-link/refresh:
    post:
      tags: [app-link]
      summary: sync.due이면 앱 서버에서 다시 받기
      responses:
        '200': { $ref: '#/components/responses/AppLink' }
        '401': { $ref: '#/components/responses/Error' }

  /me/goal:
    get:
      tags: [goal]
      summary: 목표와 AI 안내 사용량. 계산 규칙은 docs/policies.md §3
      responses:
        '200': { $ref: '#/components/responses/Goal' }
        '401': { $ref: '#/components/responses/Error' }
    put:
      tags: [goal]
      summary: 목표 하나 만들기·고치기(version 증가)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, name, amount, dueMonth]
              properties:
                category: { $ref: '#/components/schemas/GoalCategory' }
                name: { type: string, minLength: 1, maxLength: 20 }
                amount: { type: integer, format: int64, minimum: 10000, maximum: 1000000000 }
                dueMonth: { type: string, pattern: '^\d{4}-\d{2}$', description: '다음 달부터 120개월 안' }
                currentAmount: { type: integer, format: int64, nullable: true }
                monthlyPace: { type: integer, format: int64, nullable: true }
      responses:
        '200': { $ref: '#/components/responses/Goal' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
    delete:
      tags: [goal]
      summary: 목표·코치 삭제(없어도 204, 사용 횟수는 유지)
      responses:
        '204': { description: '지움' }
        '401': { $ref: '#/components/responses/Error' }
  /me/goal/coach:
    post:
      tags: [goal]
      summary: AI 안내(실패해도 기본 안내 + fallbackReason). docs/policies.md §4
      responses:
        '200':
          description: 안내
          content:
            application/json:
              schema:
                type: object
                required: [coach, ai]
                additionalProperties: false
                properties:
                  coach: { $ref: '#/components/schemas/Coach' }
                  ai: { $ref: '#/components/schemas/AiStatus' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /market/instruments:
    get:
      tags: [market]
      summary: 시장별 시가총액 상위 종목(아직 수집 전이면 items 빈 목록)
      security: []
      parameters:
        - { name: board, in: query, required: true, schema: { $ref: '#/components/schemas/Board' } }
      responses:
        '200':
          description: 종목 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardListing' }
        '400': { $ref: '#/components/responses/Error' }
  /market/events/{id}:
    get:
      tags: [market]
      summary: 사건 상세(설명 전에는 수치로 만든 사실 문장, aiGenerated=false)
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 사건
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventDetail' }
        '404': { $ref: '#/components/responses/Error' }
  /market/status:
    get:
      tags: [market]
      summary: 시세 수집 상태
      security: []
      responses:
        '200':
          description: 상태
          content:
            application/json:
              schema:
                type: object
                required: [pricesAsOf, instrumentsAsOf, instruments, empty]
                additionalProperties: false
                properties:
                  pricesAsOf: { type: string, format: date, nullable: true }
                  instrumentsAsOf: { type: string, format: date, nullable: true }
                  instruments: { type: integer }
                  empty: { type: boolean }
  /market/instruments/{id}/prices:
    get:
      tags: [market]
      summary: '구현 전 계약. 종목 일별 종가(화면 차트용, decisions/2026-10-26-invest-insight-redesign ④). 수집 대상 종목·최근 3년까지만'
      description: |
        - 기간은 마지막 거래일(dataAsOf)에서 개월 수만큼 거슬러 간 날 이후의 첫 거래일부터다. 3M=3, 6M=6, 1Y=12, 3Y=36개월.
        - 일별 종가 하나만 준다(시가·고가·저가·거래량 없음). 다운로드·내보내기 용도로 쓰지 않는다.
        - 수집 대상이 아니거나 시세가 없는 종목은 404.
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: '종목 코드' }
        - { name: period, in: query, required: false, schema: { $ref: '#/components/schemas/PricePeriod' } }
      responses:
        '200':
          description: 일별 종가
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceSeries' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /market/instruments/{id}/events:
    get:
      tags: [market]
      summary: '구현 전 계약. 종목·기간의 사건 핀(종목 사건 + 시장 사건). 금액 필드 없음. 상세는 /market/events/{id}'
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: '종목 코드' }
        - { name: period, in: query, required: false, schema: { $ref: '#/components/schemas/PricePeriod' } }
      responses:
        '200':
          description: 사건 목록(시간순). 없으면 items 빈 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceEvents' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /market/indices:
    get:
      tags: [market]
      summary: '구현 전 계약. 상단 시장 띠(국내외 지수·금·환율 9칸). 수집 전이거나 성공한 값이 없는 칸은 items에서 빠진다'
      description: |
        - 순서는 KOSPI·KOSDAQ·NASDAQ100·SP500·DJIA·NIKKEI225·GOLD·USDKRW·JPYKRW로 고정한다. 등락률로 정렬하지 않는다(PRD §5).
        - KOSPI·KOSDAQ: 키움 업종일봉(ka20006) 종합지수, unit=POINT(소수 2자리).
        - NASDAQ100·SP500·DJIA·NIKKEI225: 한국투자증권 KIS Open API, unit=POINT. 수집은 #94이고 지원 범위·재표시 조건은 그 Issue에서 확인한다.
        - GOLD: KRX 금시장 일별매매정보, unit=KRW_PER_GRAM(원 단위 정수).
        - USDKRW·JPYKRW: KIS Open API, unit=KRW_PER_USD·KRW_PER_100JPY(소수 2자리).
        - 대용 ETF로 대신하지 않는다. date는 칸마다의 기준일이며 해외 지수는 현지 거래일이다.
        - changeRate = (value − prevValue) ÷ prevValue, 소수 4자리 내림.
      security: []
      responses:
        '200':
          description: 시장 띠(수집된 칸만)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IndexStrip' }
  /market/industries:
    get:
      tags: [market]
      summary: '구현 전 계약. 업종별 시가총액 상위 종목(키움 ka10099 upName, KIWOOM_UPNAME_V1). 테마 자동 분류 아님'
      description: |
        - 수집 대상(시장별 시가총액 상위 100) 안에서만 업종으로 묶는다. 업종 빈 값은 제외한다.
        - 업종은 업종 안 시가총액 합이 큰 순, 업종 안 종목은 시가총액 순이다. 등락률로 정렬하지 않는다.
        - 아직 업종을 수집하지 않았으면 items가 빈 목록.
      security: []
      parameters:
        - { name: board, in: query, required: true, schema: { type: string, enum: [KOSPI, KOSDAQ] } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 10, default: 5 }, description: '업종마다 보여 줄 종목 수' }
      responses:
        '200':
          description: 업종별 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IndustryListing' }
        '400': { $ref: '#/components/responses/Error' }

  /simulations/run:
    post:
      tags: [simulation]
      summary: 투자 시뮬레이션(로그인 없이, 저장하지 않음). 계산 규칙은 docs/policies.md §2
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startDate, funding, legs]
              properties:
                startDate: { type: string, format: date, description: '그 달 1일로 맞춘다' }
                funding:
                  type: object
                  required: [mode]
                  properties:
                    mode: { $ref: '#/components/schemas/FundingMode' }
                    totalAmount: { type: integer, format: int64, minimum: 10000, maximum: 100000000, nullable: true, description: 'LUMP_SUM일 때' }
                    monthlyAmount: { type: integer, format: int64, minimum: 1000, maximum: 10000000, nullable: true, description: 'SPLIT·PACE일 때' }
                legs:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items:
                    type: object
                    required: [instrumentId]
                    properties:
                      instrumentId: { type: string }
                      weight: { type: number, nullable: true, description: '모두 비우면 균등, 넣으면 합 1' }
      responses:
        '200':
          description: 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /youth-news:
    get:
      tags: [youth-news]
      summary: 청년 금융 소식(수집한 소식을 검수 없이 게시, 01 §F4). 필터는 고르지 않으면 빼고 본다. 5분 캐시(Cache-Control max-age=300, public)
      description: |
        - 매일 06:00 수집한 소식을 사람 검수 없이 내보낸다(2026-10-26 결정). 반려(REJECTED)한 것만 뺀다.
        - category: 소식이 드는 분야(categories) 중 하나라도 맞으면 보인다.
        - age: 원문에서 확인 못 한 나이 쪽(null)은 막지 않는다.
        - region: 전국 소식은 어느 지역을 골라도 보인다. 지역을 확인 못 한 소식은 나오지 않는다.
        - 신청 날짜가 없는데 사업기간이 끝난 소식은 그날(Asia/Seoul) 기준으로 뺀다.
      security: []
      parameters:
        - { name: age, in: query, required: false, schema: { type: integer }, description: '만 나이' }
        - { name: region, in: query, required: false, schema: { type: string }, description: '시도 이름(서울·경기…)' }
        - { name: category, in: query, required: false, schema: { $ref: '#/components/schemas/NewsCategory' } }
      responses:
        '200':
          description: 소식 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/YouthNewsFeed' }
        '400': { $ref: '#/components/responses/Error' }

  /health:
    get:
      tags: [health]
      summary: 살아 있는지
      security: []
      responses:
        '200':
          description: UP
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status: { type: string, enum: [UP] }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Provider:
      name: provider
      in: path
      required: true
      schema: { type: string, enum: [kakao, google] }

  responses:
    Error:
      description: '오류. code는 ErrorCode, message는 화면에 그대로 보여 줄 문장'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Auth:
      description: 웹 토큰과 계정
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthResponse' }
    Settings:
      description: 화면 설정
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Settings' }
    SeedMoney:
      description: 웹 시드머니
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SeedMoneyResponse' }
    AppLink:
      description: 앱 연동 상태
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AppLink' }
    Goal:
      description: 목표와 AI 사용량
      content:
        application/json:
          schema:
            type: object
            required: [goal, ai]
            additionalProperties: false
            properties:
              goal: { $ref: '#/components/schemas/GoalView' }
              ai: { $ref: '#/components/schemas/AiStatus' }

  schemas:
    PracticeToken:
      type: object
      additionalProperties: false
      required: [sessionToken]
      properties:
        sessionToken: { type: string, minLength: 43, maxLength: 128 }
    PracticeCommand:
      type: object
      additionalProperties: false
      required: [sessionToken, commandId, expectedVersion]
      properties:
        sessionToken: { type: string, minLength: 43, maxLength: 128 }
        commandId: { type: string, format: uuid }
        expectedVersion: { type: integer, minimum: 0 }
    PracticePortfolio:
      type: object
      additionalProperties: false
      required: [cash, shares, stockValue, total, profit, returnRate]
      properties:
        cash: { type: integer, format: int64, minimum: 0 }
        shares: { type: integer, format: int64, minimum: 0 }
        stockValue: { type: integer, format: int64, minimum: 0 }
        total: { type: integer, format: int64, minimum: 0 }
        profit: { type: integer, format: int64 }
        returnRate: { type: number, description: '서버가 소수 4자리 내림' }
    PracticeSnapshot:
      type: object
      additionalProperties: false
      required: [version, status, instrument, initialAmount, isSample, candles, frames, portfolio, event, decisions, notice, sources]
      properties:
        version: { type: integer, minimum: 0 }
        status: { type: string, enum: [RUNNING, AWAITING_DECISION, FINISHED] }
        instrument:
          type: object
          additionalProperties: false
          required: [code, name, categoryCode, categoryName, classificationVersion, classificationAsOf]
          properties:
            code: { type: string }
            name: { type: string }
            categoryCode: { type: string }
            categoryName: { type: string }
            classificationVersion: { type: string }
            classificationAsOf: { type: string, format: date }
        initialAmount: { type: integer, format: int64, minimum: 10000, maximum: 100000000 }
        isSample: { type: boolean }
        candles:
          type: array
          minItems: 1
          maxItems: 120
          description: '공개된 봉만 날짜 오름차순. 아직 진행하지 않은 봉 없음'
          items:
            type: object
            additionalProperties: false
            required: [date, open, high, low, close]
            properties:
              date: { type: string, format: date }
              open: { type: integer, format: int64, minimum: 1 }
              high: { type: integer, format: int64, minimum: 1 }
              low: { type: integer, format: int64, minimum: 1 }
              close: { type: integer, format: int64, minimum: 1 }
        frames:
          type: array
          maxItems: 120
          description: 'step 응답에서만 이번에 새로 공개된 봉마다 그날 종가 기준 자산(날짜 오름차순, 마지막 항목 = portfolio). 화면은 이 구간을 3초에 나눠 재생한다. start·state·decision 응답은 빈 배열'
          items:
            type: object
            additionalProperties: false
            required: [date, portfolio]
            properties:
              date: { type: string, format: date }
              portfolio: { $ref: '#/components/schemas/PracticePortfolio' }
        portfolio: { $ref: '#/components/schemas/PracticePortfolio' }
        event:
          type: object
          nullable: true
          additionalProperties: false
          description: 'AWAITING_DECISION일 때만 현재 문제. 그 밖에는 null'
          required: [id, title, publishedDate, baselineDate, sourceUrl, sourceName]
          properties:
            id: { type: string }
            title: { type: string, description: '원문 공시 제목. 사후 급등/급락 요약 금지' }
            publishedDate: { type: string, format: date }
            baselineDate: { type: string, format: date, description: '현재 마지막 봉 날짜. 휴일 접수면 접수일보다 앞설 수 있음' }
            sourceUrl: { type: string, format: uri }
            sourceName: { type: string }
        decisions:
          type: array
          maxItems: 3
          description: '이미 제출한 선택만 반환. 판정 전 결과와 수익률은 null'
          items:
            type: object
            additionalProperties: false
            required: [eventId, title, publishedDate, baselineDate, sourceUrl, prediction, action, allocationPercent, execution, executedDate, executedPrice, executedShares, outcome, outcomeDate, subsequentReturnRate]
            properties:
              eventId: { type: string }
              title: { type: string }
              publishedDate: { type: string, format: date }
              baselineDate: { type: string, format: date }
              sourceUrl: { type: string, format: uri }
              prediction: { type: string, enum: [POSITIVE, NEGATIVE] }
              action: { type: string, enum: [BUY, SELL, HOLD] }
              allocationPercent: { type: integer, enum: [0, 25, 50, 100] }
              execution: { type: string, enum: [PENDING, FILLED, NO_FILL, HOLD] }
              executedDate: { type: string, format: date, nullable: true }
              executedPrice: { type: integer, format: int64, nullable: true, minimum: 1 }
              executedShares: { type: integer, format: int64, nullable: true, minimum: 0 }
              outcome: { type: string, nullable: true, enum: [CORRECT, INCORRECT, NEUTRAL, null] }
              outcomeDate: { type: string, format: date, nullable: true }
              subsequentReturnRate: { type: number, nullable: true }
        notice: { type: string, description: '과거 계산·원금 손실·비권유, 세금/수수료/배당 제외, 표본 편향과 현재 업종 분류 고지' }
        sources:
          type: array
          minItems: 1
          items: { type: string }
    Error:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          enum: [VALIDATION_FAILED, UNAUTHORIZED, INVALID_CREDENTIALS, SOCIAL_ACCOUNT, OAUTH_CODE_INVALID, NOT_FOUND,
            GOAL_CHANGED, EMAIL_UNAVAILABLE, TOO_MANY_ATTEMPTS, MARKET_UNAVAILABLE, LINK_CODE_INVALID, APP_LINK_EXISTS,
            APP_LINK_IN_PROGRESS, APP_LINK_RESULT_UNKNOWN, APP_UNAVAILABLE, INTERNAL_ERROR,
            PRACTICE_CONFLICT, PRACTICE_EXPIRED, PRACTICE_UNAVAILABLE, PRACTICE_CAPACITY]
        message: { type: string }
        fields:
          type: object
          description: VALIDATION_FAILED에서 필드별 문장
          additionalProperties: { type: string }
        retryAfterSeconds: { type: integer, format: int64, description: 'TOO_MANY_ATTEMPTS' }
        plan: { type: string, enum: [FREE], description: '목표 안내 횟수 초과' }
        limitPerDay: { type: integer, description: '목표 안내 횟수 초과' }
        field: { type: string, description: 'MARKET_UNAVAILABLE의 종목 코드' }
        provider: { type: string, description: 'SOCIAL_ACCOUNT의 가입 공급자' }

    Me:
      type: object
      required: [id, email, createdAt, provider, hasPassword]
      additionalProperties: false
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, nullable: true, description: '소셜 가입에서 이메일을 받지 못했으면 null' }
        createdAt: { type: string, format: date-time }
        provider: { type: string, enum: [email, kakao, google] }
        hasPassword: { type: boolean }
    AuthResponse:
      type: object
      required: [accessToken, expiresAt, user]
      additionalProperties: false
      properties:
        accessToken: { type: string }
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/Me' }
    Settings:
      type: object
      required: [theme, seenTours, disclaimerAckAt]
      additionalProperties: false
      properties:
        theme: { type: string, enum: [light, dark] }
        seenTours: { type: array, items: { type: string } }
        disclaimerAckAt: { type: string, format: date-time, nullable: true }

    SeedStatus:
      type: string
      enum: [available, budget_not_set, not_received]
    SeedEntry:
      type: object
      required: [cycleEnd, choice, amount, totalAfter, createdAt]
      additionalProperties: false
      properties:
        cycleEnd: { type: string, format: date }
        choice: { type: string, enum: [GOAL, ALL, MANUAL] }
        amount: { type: integer, format: int64 }
        totalAfter: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time, nullable: true }
    Sync:
      type: object
      nullable: true
      description: 연동이 없으면 null
      required: [status, syncedAt, due]
      additionalProperties: false
      properties:
        status: { type: string, enum: [fresh, stale] }
        syncedAt: { type: string, format: date-time, nullable: true }
        due: { type: boolean, description: '다시 받을 때가 됨(화면이 POST /app-link/refresh)' }
    SeedMoneyResponse:
      type: object
      required: [source, status, total, base, monthlyGoal, startedOn, updatedAt, entries, sync, manual]
      additionalProperties: false
      properties:
        source: { type: string, enum: [app, none] }
        status: { type: string, nullable: true, enum: [available, budget_not_set, not_received, null] }
        total: { type: integer, format: int64, nullable: true }
        base: { type: integer, format: int64, nullable: true }
        monthlyGoal: { type: integer, format: int64, nullable: true }
        startedOn: { type: string, format: date, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }
        entries:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/SeedEntry' }
        sync: { $ref: '#/components/schemas/Sync' }
        manual:
          nullable: true
          type: object
          required: [total, updatedAt]
          additionalProperties: false
          properties:
            total: { type: integer, format: int64 }
            updatedAt: { type: string, format: date-time }

    AppLink:
      type: object
      required: [enabled, linked, reason, linkedAt, account, seedMoney, sync]
      additionalProperties: false
      properties:
        enabled: { type: boolean, description: 'false면 화면이 [앱 연동하기]를 숨긴다' }
        linked: { type: boolean }
        reason: { type: string, nullable: true, enum: [app_unlinked, null] }
        linkedAt: { type: string, format: date-time, nullable: true }
        account:
          nullable: true
          type: object
          required: [email, provider]
          additionalProperties: false
          properties:
            email: { type: string, nullable: true }
            provider: { type: string }
        seedMoney:
          nullable: true
          type: object
          required: [status, total, base, monthlyGoal, lastEntry, updatedAt, startedOn, entries]
          additionalProperties: false
          properties:
            status: { $ref: '#/components/schemas/SeedStatus' }
            total: { type: integer, format: int64, nullable: true }
            base: { type: integer, format: int64, nullable: true }
            monthlyGoal: { type: integer, format: int64, nullable: true }
            lastEntry:
              nullable: true
              type: object
              required: [cycleEnd, choice, amount, createdAt]
              additionalProperties: false
              properties:
                cycleEnd: { type: string, format: date }
                choice: { type: string, enum: [GOAL, ALL, MANUAL] }
                amount: { type: integer, format: int64, nullable: true }
                createdAt: { type: string, format: date-time, nullable: true }
            updatedAt: { type: string, format: date-time, nullable: true }
            startedOn: { type: string, format: date, nullable: true }
            entries:
              type: array
              nullable: true
              items: { $ref: '#/components/schemas/SeedEntry' }
        sync: { $ref: '#/components/schemas/Sync' }

    GoalCategory:
      type: string
      enum: [EMERGENCY, TRAVEL, DEVICE, TUITION, HOUSING, OTHER]
    AiStatus:
      type: object
      required: [available, plan, limitPerDay, remainingToday]
      additionalProperties: false
      properties:
        available: { type: boolean, description: '서버에 AI 키가 있는지' }
        plan: { type: string, enum: [FREE] }
        limitPerDay: { type: integer }
        remainingToday: { type: integer }
    GoalView:
      type: object
      nullable: true
      description: 목표가 없으면 null
      required: [id, version, category, name, amount, dueMonth, currentAmount, monthlyPace, createdAt, updatedAt, seed,
        progress, scenarios, checkpoints, coach]
      additionalProperties: false
      properties:
        id: { type: integer, format: int64 }
        version: { type: integer }
        category: { $ref: '#/components/schemas/GoalCategory' }
        name: { type: string }
        amount: { type: integer, format: int64 }
        dueMonth: { type: string, pattern: '^\d{4}-\d{2}$' }
        currentAmount: { type: integer, format: int64, nullable: true }
        monthlyPace: { type: integer, format: int64, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        seed:
          type: object
          required: [source, current, pace, asOf, appStatus]
          additionalProperties: false
          properties:
            source: { type: string, enum: [app, manual] }
            current: { type: integer, format: int64 }
            pace: { type: integer, format: int64, nullable: true }
            asOf: { type: string, format: date-time, nullable: true }
            appStatus: { type: string, nullable: true }
        progress:
          type: object
          required: [thisMonth, current, remaining, ratioBp, monthsLeft, requiredMonthly, expectedMonths, expectedMonth,
            status, monthlyGap, dailyGap]
          additionalProperties: false
          properties:
            thisMonth: { type: string }
            current: { type: integer, format: int64 }
            remaining: { type: integer, format: int64 }
            ratioBp: { type: integer, minimum: 0, maximum: 10000 }
            monthsLeft: { type: integer, format: int64 }
            requiredMonthly: { type: integer, format: int64, nullable: true, description: '천 원 단위 올림, 기한 지나면 null' }
            expectedMonths: { type: integer, format: int64, nullable: true }
            expectedMonth: { type: string, nullable: true }
            status: { type: string, enum: [REACHED, OVERDUE, NO_PACE, ON_TRACK, BEHIND] }
            monthlyGap: { type: integer, format: int64 }
            dailyGap: { type: integer, format: int64, description: '100원 단위 올림' }
        scenarios:
          type: array
          items:
            type: object
            required: [key, monthly, reachMonth]
            additionalProperties: false
            properties:
              key: { type: string, enum: [KEEP_PACE, MEET_DUE, EXTEND_6] }
              monthly: { type: integer, format: int64 }
              reachMonth: { type: string, nullable: true }
        checkpoints:
          type: array
          items:
            type: object
            required: [percent, month, target]
            additionalProperties: false
            properties:
              percent: { type: integer, enum: [25, 50, 75, 100] }
              month: { type: string }
              target: { type: integer, format: int64 }
        coach: { $ref: '#/components/schemas/Coach' }
    Coach:
      type: object
      nullable: true
      description: 목표 응답에서는 아직 받지 않았으면 null
      required: [aiGenerated, model, fallbackReason, generatedAt, stale, headline, summary, steps, noticeKey, notice]
      additionalProperties: false
      properties:
        aiGenerated: { type: boolean }
        model: { type: string, nullable: true }
        fallbackReason:
          type: string
          nullable: true
          enum: [AI_UNAVAILABLE, DAILY_CAP, AI_FAILED, AI_REJECTED, null]
          description: AI가 응답하지 않았거나 쓰지 않은 이유. aiGenerated=true면 null
        generatedAt: { type: string, format: date-time, nullable: true }
        stale: { type: boolean, description: '목표 숫자가 바뀌어 다시 받을 수 있음' }
        headline: { type: string }
        summary: { type: string }
        steps:
          type: array
          items:
            type: object
            required: [title, detail]
            additionalProperties: false
            properties:
              title: { type: string }
              detail: { type: string }
        noticeKey: { type: string }
        notice: { type: string }

    Board:
      type: string
      enum: [KOSPI, KOSDAQ, ETF]
