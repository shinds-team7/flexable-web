        monthlyAmount: { type: integer, format: int64 }
        totalInvested: { type: integer, format: int64 }
        finalValue: { type: integer, format: int64 }
        profit: { type: integer, format: int64 }
        returnRate: { type: number, description: '소수 4자리 내림' }
        engineVersion: { type: string }
        dataAsOf: { type: string, format: date }
        seriesBasis: { type: string, enum: [WEEK_LAST_CLOSE] }
        legs:
          type: array
          items:
            type: object
            required: [id, name, kind, weight, invested, finalValue]
            additionalProperties: false
            properties:
              id: { type: string }
              name: { type: string }
              kind: { type: string, enum: [STOCK, ETF] }
              weight: { type: number }
              invested: { type: integer, format: int64 }
              finalValue: { type: integer, format: int64 }
        series:
          type: array
          items:
            type: object
            required: [weekStart, date, tradingDays, total, invested, contributed, profit, returnRate, legs]
            additionalProperties: false
            properties:
              weekStart: { type: string, format: date }
              date: { type: string, format: date }
              tradingDays: { type: integer }
              total: { type: integer, format: int64 }
              invested: { type: integer, format: int64 }
              contributed: { type: integer, format: int64 }
              profit: { type: integer, format: int64 }
              returnRate: { type: number }
              legs:
                type: array
                items:
                  type: object
                  required: [id, close, value, invested]
                  additionalProperties: false
                  properties:
                    id: { type: string }
                    close: { type: integer, format: int64, nullable: true }
                    value: { type: integer, format: int64 }
                    invested: { type: integer, format: int64 }
        events:
          type: array
          items:
            type: object
            required: [id, code, scope, startDate, endDate, windowDays, direction, returnRate, marketReturn, headline,
              hasExplanation, sourceName, sourceCount, topSource, score, valueBefore, valueAfter, contributionInWindow,
              valueChange, noticeKey]
            additionalProperties: false
            properties:
              id: { type: integer, format: int64 }
              code: { type: string, nullable: true }
              scope: { type: string, enum: [STOCK, MARKET] }
              startDate: { type: string, format: date }
              endDate: { type: string, format: date }
              windowDays: { type: integer }
              direction: { type: string, enum: [RISE, FALL] }
              returnRate: { type: number }
              marketReturn: { type: number, nullable: true }
              headline: { type: string }
              hasExplanation: { type: boolean }
              sourceName: { type: string, nullable: true }
              sourceCount: { type: integer }
              topSource: { type: string, nullable: true }
              score: { type: number }
              valueBefore: { type: integer, format: int64, nullable: true }
              valueAfter: { type: integer, format: int64, nullable: true }
              contributionInWindow: { type: integer, format: int64, nullable: true }
              valueChange: { type: integer, format: int64, nullable: true }
              noticeKey: { type: string }
        assumptions: { type: array, items: { type: string } }
        noticeKey: { type: string, enum: [SIM_PAST] }
        notice: { type: string }
        sources:
          type: array
          items:
            type: object
            required: [name, note]
            additionalProperties: false
            properties:
              name: { type: string }
              note: { type: string, nullable: true }
    NewsCategory:
      type: string
      description: '교통·주거·일자리·교육·저축·금융·생활·문화·세금·기타'
      enum: [TRANSPORT, HOUSING, JOB, EDUCATION, FINANCE, CULTURE, TAX, ETC]
    YouthNewsFeed:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/YouthNewsItem' } }
    YouthNewsItem:
      type: object
      required: [id, category, categories, title, summary, benefit, audience, regions, applyStart, applyDeadline, alwaysOpen, action, source,
        postedAt, keywords, calcLink, correctedAt, slot]
      additionalProperties: false
      properties:
        id: { type: string }
        category: { $ref: '#/components/schemas/NewsCategory' }
        categories:
          type: array
          minItems: 1
          description: '이 소식이 드는 분야 전부. 첫 번째가 대표(category)'
          items: { $ref: '#/components/schemas/NewsCategory' }
        title: { type: string }
        summary: { type: string, nullable: true, description: 'AI 요약(Gemini, 1~3문장). 원문에 없는 숫자가 있으면 버려서 null. 화면에 "AI 요약" 표시' }
        benefit: { type: string, nullable: true, description: '나에게 얼마(사람이 쓰던 항목). 지금은 null' }
        audience: { $ref: '#/components/schemas/YouthNewsAudience' }
        regions:
          description: '"NATIONWIDE"(전국) 또는 시도 이름 목록'
          oneOf:
            - { type: string, enum: [NATIONWIDE] }
            - { type: array, items: { type: string } }
        applyStart: { type: string, format: date, nullable: true }
        applyDeadline: { type: string, format: date, nullable: true }
        alwaysOpen: { type: boolean }
        action: { type: string, nullable: true, description: '오늘 할 일(사람이 쓰던 항목). 지금은 null' }
        source: { $ref: '#/components/schemas/YouthNewsSource' }
        postedAt: { type: string, format: date, nullable: true }
        keywords: { type: array, items: { type: string } }
        calcLink: { $ref: '#/components/schemas/YouthNewsCalcLink' }
        correctedAt: { type: string, format: date, nullable: true, description: '게시 뒤 정정한 날' }
        slot: { type: string, enum: [MAIN, SUB], nullable: true, description: 'MAIN = 오늘의 한 장' }
    YouthNewsAudience:
      type: object
      required: [summary, ageMin, ageMax, incomeLimit]
      additionalProperties: false
      properties:
        summary: { type: string, nullable: true, description: '나이 외 조건 요약' }
        ageMin: { type: integer, nullable: true }
        ageMax: { type: integer, nullable: true }
        incomeLimit: { type: boolean, nullable: true, description: '원문에 소득 기준이 있으면 true, 언급이 없으면 null' }
    YouthNewsSource:
      type: object
      required: [org, url, asOf]
      additionalProperties: false
      properties:
        org: { type: string }
        url: { type: string }
        asOf: { type: string, format: date }
    YouthNewsCalcLink:
      type: object
      nullable: true
      required: [to, label]
      additionalProperties: false
      description: '[계산해 보기]가 여는 내부 화면. 없으면 null'
      properties:
        to: { type: string }
        label: { type: string }
