    put:
      tags: [seed-money]
      summary: 직접 고친 시드머니 저장(0~10억 원 정수). 앱 연동 회원이면 앱에도 반영
      description: |
        연동 회원이면 앱 서버(`PUT /internal/v1/web-links/{linkId}/seed-money`)에 총액을 보낸다. 성공하면 웹의 직접 수정값을 지우고
        앱이 돌려준 값으로 연동 값을 바꾼다(`appSync.status=applied`, `manual=null`). 실패하면 웹에만 저장하고(`manual` 있음)
        `appSync.status=failed`와 안내 문구를 준다. 연동하지 않았으면 웹에만 저장하고 `appSync=null`. 규칙은 docs/policies.md §1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [total]
              properties:
                total: { type: integer, format: int64, minimum: 0, maximum: 1000000000 }
      responses:
        '200': { $ref: '#/components/responses/SeedMoney' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
    delete:
      tags: [seed-money]
      summary: 직접 고친 값을 지우고 앱 기록 기준으로(없어도 204)
      responses:
        '204': { description: '지움' }
        '401': { $ref: '#/components/responses/Error' }

  /app-link:
    get:
      tags: [app-link]
      summary: 연동 상태(저장한 마지막 값, 앱 서버를 부르지 않음)
      responses:
        '200': { $ref: '#/components/responses/AppLink' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [app-link]
      summary: 앱에서 받은 6자리 코드로 연동
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, maxLength: 20, pattern: '^[A-Za-z0-9 -]*$' }
      responses:
        '201': { $ref: '#/components/responses/AppLink' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      tags: [app-link]
      summary: 연동 해제(앱 서버 장애면 503이고 연동은 남음)
      responses:
        '204': { description: '해제함' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /app-link/refresh:
    post:
      tags: [app-link]
      summary: sync.due이면 앱 서버에서 다시 받기
      responses:
        '200': { $ref: '#/components/responses/AppLink' }
        '401': { $ref: '#/components/responses/Error' }

  /me/goal:
    get:
      tags: [goal]
      summary: 목표와 AI 안내 사용량. 계산 규칙은 docs/policies.md §3
      responses:
        '200': { $ref: '#/components/responses/Goal' }
        '401': { $ref: '#/components/responses/Error' }
    put:
      tags: [goal]
      summary: 목표 하나 만들기·고치기(version 증가)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, name, amount, dueMonth]
              properties:
                category: { $ref: '#/components/schemas/GoalCategory' }
                name: { type: string, minLength: 1, maxLength: 20 }
                amount: { type: integer, format: int64, minimum: 10000, maximum: 1000000000 }
                dueMonth: { type: string, pattern: '^\d{4}-\d{2}$', description: '다음 달부터 120개월 안' }
                currentAmount: { type: integer, format: int64, nullable: true }
                monthlyPace: { type: integer, format: int64, nullable: true }
      responses:
        '200': { $ref: '#/components/responses/Goal' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
    delete:
      tags: [goal]
      summary: 목표·코치 삭제(없어도 204, 사용 횟수는 유지)
      responses:
        '204': { description: '지움' }
        '401': { $ref: '#/components/responses/Error' }
  /me/goal/coach:
    post:
      tags: [goal]
      summary: AI 안내(실패해도 기본 안내 + fallbackReason). docs/policies.md §4
      responses:
        '200':
          description: 안내
          content:
            application/json:
              schema:
                type: object
                required: [coach, ai]
                additionalProperties: false
                properties:
                  coach: { $ref: '#/components/schemas/Coach' }
                  ai: { $ref: '#/components/schemas/AiStatus' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /goal/scenarios:
    post:
      tags: [goal]
      summary: 'F7 v2 목표 달성 시나리오(로그인 없이도 씀, 회원이면 AI 조합). 조합은 제안기(AI 또는 데모), 숫자는 서버 계산. docs/policies.md §7'
      description: |
        - 계산 결과는 DB에 저장하지 않고, 저장(`POST /me/goal/scenarios`)을 위해 30분 동안 서버 메모리에만 둔다(resultId). 목표 이름은 계산에 쓰지 않고 그대로 돌려주며 로그에 남기지 않는다.
        - 로그인 토큰이 있으면 회원으로 보고 AI(OpenAI) 조합을 준다(하루 횟수·서비스 상한). 회원이 받은 AI 조합(유형·비중·문구)은 목표 금액·기한·월 납입 가능액·자료 기준일과 함께 그 회원의 재사용용으로 DB에 두고, 같은 조건이면 다시 부르지 않는다(aiReused). 7일 뒤 삭제, 탈퇴하면 즉시 삭제(§7-6). 토큰이 없으면 데모 조합(GUEST). 토큰이 잘못됐거나 탈퇴한 회원이면 401.
        - 제안기가 낸 조합(유형·비중)을 §7-6으로 검증하고, 실패하거나 AI 키가 없으면 데모 조합을 쓴다(proposer, fallbackReason, aiUsage).
        - 경로 2,000개·seed 고정이라 같은 입력과 같은 자료면 같은 응답이다.
        - 수익률 자료(월말 종가 61개)가 모자란 종목이 있으면 503 MARKET_UNAVAILABLE(field = 종목 코드), 기한 이하 만기의 적금 후보가 없으면 field = SAVINGS.
        - 기한은 개월 수(6~60, 11-11 #406에서 36 → 60)로 받는다. 기한과 같은 만기의 적금이 없으면 기한 이하 만기 중 가장 긴 적금을 쓰고 남은 달은 CMA 예시 금리로 계산한다(products[SAVINGS].termMonths, §7-2·7-3).
        - 월 납입 가능액(monthlyBudget)은 선택이다. 필요 월 금액 계산은 바꾸지 않고 시나리오마다 비교만 한다(withinBudget·overBudgetBy). 가능액 밖인 시나리오는 서버가 정해 둔 대안 문장을 해설 fit 칸 끝과 explanation 끝에 붙인다(§7-5). 회원이면 AI에도 보낸다(§7-6).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, targetAmount, months]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 20, description: '앞뒤 공백을 뺀 1~20자' }
                targetAmount: { type: integer, format: int64, minimum: 1000000, maximum: 1000000000 }
                months: { type: integer, minimum: 6, maximum: 60, description: '기한(개월). 화면은 연·월로 받아 개월로 보낸다' }
                monthlyBudget: { type: integer, format: int64, nullable: true, minimum: 10000, maximum: 1000000000, multipleOf: 1000, description: '월 납입 가능액(선택, 천 원 단위, 1만 원~목표 금액). 빼거나 null이면 지금과 같이 계산한다. 목표 금액보다 크면 400 monthlyBudget(policies §7-1)' }
      responses:
        '200':
          description: 시나리오 3개
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoalScenarioResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /me/goal/scenarios:
    get:
      tags: [goal]
      summary: '저장한 목표 시나리오 목록(최신순, 최대 5개). policies §7-8'
      responses:
        '200':
          description: 목록
          content:
            application/json:
              schema:
                type: object
                required: [items, limit]
                additionalProperties: false
                properties:
                  items: { type: array, maxItems: 5, items: { $ref: '#/components/schemas/SavedGoalScenarioSummary' } }
                  limit: { type: integer, description: '저장할 수 있는 개수(5)' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [goal]
      summary: '방금 계산한 결과(resultId)의 플랜 전체를 그때 값 그대로 저장. scenarioId는 다시 볼 때 먼저 보여 줄 플랜. 5개(저장 건 기준)가 차 있으면 409 GOAL_SCENARIO_LIMIT, 30분이 지났거나 없는 resultId면 409 GOAL_SCENARIO_EXPIRED'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resultId, scenarioId]
              additionalProperties: false
              properties:
                resultId: { type: string }
                scenarioId: { type: string }
      responses:
        '201':
          description: 저장한 시나리오
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedGoalScenario' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /me/goal/scenarios/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [goal]
      summary: '저장한 시나리오 하나(저장할 때 값 그대로). 남의 것이거나 없으면 404'
      responses:
        '200':
          description: 저장한 시나리오
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedGoalScenario' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [goal]
      summary: '저장한 시나리오 지우기. 남의 것이거나 없으면 404'
      responses:
        '204': { description: 지움 }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /me/virtual-sim/contests:
    get:
      tags: [virtual-sim]
      summary: '내 대회 기록: 별명, 이번 대회 내 기록(배치고사·지금 판·판 점수·이번 주·오늘), 지난 대회 결과(최대 12개). policies §8-8'
      responses:
        '200':
          description: 내 기록
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [alias, current, history]
                properties:
                  alias: { type: string, nullable: true, description: '서버가 붙인 익명 별명(vsim-alias-v1). 한 번도 참가하지 않았으면 null' }
                  current: { anyOf: [{ $ref: '#/components/schemas/VirtualContestEntry' }, { nullable: true, enum: [null] }], description: '이번 대회 배치고사를 마치지 않았으면 null' }
                  history:
                    type: array
                    maxItems: 12
                    description: '정산한 지난 대회, 최신순. 대회가 끝난 뒤 12개월이 지나면 빠진다'
                    items: { $ref: '#/components/schemas/VirtualContestResult' }
        '401': { $ref: '#/components/responses/Error' }
  /market/instruments:
    get:
      tags: [market]
      summary: 시장별 시가총액 상위 종목(아직 수집 전이면 items 빈 목록)
      security: []
      parameters:
        - { name: board, in: query, required: true, schema: { $ref: '#/components/schemas/Board' } }
      responses:
        '200':
          description: 종목 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardListing' }
              example:
                board: KOSPI
                source: 키움 REST(예시)
                note: null
                dataAsOf: '2026-10-24'
                items:
                  - { id: '005930', name: 삼성전자, market: KOSPI, kind: STOCK, board: KOSPI, rank: 1, marketCap: 500000000000000 }
                  - { id: '000660', name: SK하이닉스, market: KOSPI, kind: STOCK, board: KOSPI, rank: 2, marketCap: 150000000000000 }
                  - { id: '373220', name: LG에너지솔루션, market: KOSPI, kind: STOCK, board: KOSPI, rank: 3, marketCap: 90000000000000 }
        '400': { $ref: '#/components/responses/Error' }
  /market/events/{id}:
    get:
      tags: [market]
      summary: 사건 상세(whatHappened는 수치로 만든 사실 문장, aiGenerated=false. AI 개요는 aiSummary)
      description: |
        - aiSummary: worker가 미리 만들어 저장한 AI 개요(decisions/2026-10-29-event-ai-summary). 요청 중에 AI를 부르지 않는다.
        - 아직 만들지 않았거나 키가 없거나 검사에서 탈락했거나 운영자가 공개를 멈췄으면 null이다. 나머지 필드는 그대로다.
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 사건
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventDetail' }
        '404': { $ref: '#/components/responses/Error' }
  /market/events/{id}/news:
    get:
      tags: [market]
      summary: '사건 무렵 뉴스 기사(NAVER API HUB 뉴스 검색 중계, decisions/2026-10-28-event-news). 저장·캐시 없음'
      description: |
        - 요청 중 서버가 네이버 뉴스 검색을 불러 그대로 돌려준다. DB·서버 캐시에 기사를 두지 않고 응답은 no-store다.
        - 발행 시각이 from~to(사건 시작일 3일 전 ~ 마지막 날 3일 뒤, KST, 포함) 안인 기사만, 발행 순으로 최대 5건.
        - 검색에 날짜 조건이 없어 지난 사건은 기사를 찾지 못할 수 있다(items 빈 목록, status OK).
        - 키 없음·호출 실패·하루 한도면 status UNAVAILABLE, items 빈 목록(200). 사건 상세는 따로 불러 영향이 없다.
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 그때 뉴스(없으면 items 빈 목록)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventNews' }
        '404': { $ref: '#/components/responses/Error' }
  /market/status:
    get:
      tags: [market]
      summary: 시세 수집 상태
      security: []
      responses:
        '200':
          description: 상태
          content:
            application/json:
              schema:
                type: object
                required: [pricesAsOf, instrumentsAsOf, instruments, empty]
                additionalProperties: false
                properties:
                  pricesAsOf: { type: string, format: date, nullable: true }
                  instrumentsAsOf: { type: string, format: date, nullable: true }
                  instruments: { type: integer }
                  empty: { type: boolean }
  /market/instruments/{id}/prices:
    get:
      tags: [market]
      summary: '구현 전 계약. 종목 일별 종가(화면 차트용, decisions/2026-10-26-invest-insight-redesign ④). 수집 대상 종목·최근 3년까지만'
      description: |
        - 기간은 마지막 거래일(dataAsOf)에서 개월 수만큼 거슬러 간 날 이후의 첫 거래일부터다. 3M=3, 6M=6, 1Y=12, 3Y=36개월.
        - 일별 종가 하나만 준다(시가·고가·저가·거래량 없음). 다운로드·내보내기 용도로 쓰지 않는다.
        - 수집 대상이 아니거나 시세가 없는 종목은 404.
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: '종목 코드' }
        - { name: period, in: query, required: false, schema: { $ref: '#/components/schemas/PricePeriod' } }
      responses:
        '200':
          description: 일별 종가
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceSeries' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /market/instruments/{id}/events:
    get:
      tags: [market]
      summary: '구현 전 계약. 종목·기간의 사건 핀(종목 사건 + 시장 사건). 금액 필드 없음. 상세는 /market/events/{id}'
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: '종목 코드' }
        - { name: period, in: query, required: false, schema: { $ref: '#/components/schemas/PricePeriod' } }
      responses:
        '200':
          description: 사건 목록(시간순). 없으면 items 빈 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceEvents' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /market/indices:
    get:
      tags: [market]
      summary: '상단 시장 띠(국내 지수·채권지수·금·환율 8칸). 수집 전이거나 성공한 값이 없는 칸은 items에서 빠진다'
      description: |
        - 순서는 KOSPI·KOSDAQ·KRXBOND·GOLD·USDKRW·JPYKRW·EURKRW·CNYKRW로 고정한다. 등락률로 정렬하지 않는다(PRD §5).
        - KOSPI·KOSDAQ: 키움 업종일봉(ka20006) 종합지수, unit=POINT(소수 2자리).
        - KRXBOND: KRX 채권지수 시세정보(idx/bon_dd_trd) 종합 지수의 총수익지수, unit=POINT(소수 2자리).
        - GOLD: KRX 금시장 일별매매정보, unit=KRW_PER_GRAM(원 단위 정수).
        - USDKRW·JPYKRW·EURKRW·CNYKRW: 한국수출입은행 현재환율 API 매매기준율, unit=KRW_PER_USD·KRW_PER_100JPY·KRW_PER_EUR·KRW_PER_CNY(소수 2자리). CNYKRW는 수출입은행 통화 코드 CNH다.
        - 해외 지수(나스닥100·S&P500·다우존스·니케이225)는 지수 회사 허락 전까지 보류한다(결정 ⑤). 대용 ETF·CFD로 대신하지 않는다. date는 칸마다의 기준일이다.
        - changeRate = (value − prevValue) ÷ prevValue, 소수 4자리 내림.
