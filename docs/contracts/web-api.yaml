  /virtual-sim/contests/current/placement/answers:
    post:
      tags: [virtual-sim]
      summary: '배치고사 제출·채점·참가(회원). 맞힌 수로 시작 판, 잔액 = 그 판의 대회 시드머니'
      description: '공시 직후 실제 방향(반응 창: 기준 봉 전날 종가 → 다음 거래일 종가)으로 채점(올랐으면 POSITIVE, 내렸으면 NEGATIVE가 맞음, null은 틀림). 이 규칙 전에 시작한 배치고사는 시작할 때의 기준(5거래일)으로 채점하고 items[].basis로 구분한다. 맞힌 수 0~6 B10M, 7~8 B50M, 9~10 B100M. 같은 placementId를 다시 보내거나 30분이 지난 뒤 보내면 처음(또는 서버가 매긴) 결과 그대로 200. 없는 placementId·남의 것은 404, 문제 id가 맞지 않으면 400'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [placementId, answers]
              properties:
                placementId: { type: string }
                answers:
                  type: array
                  minItems: 10
                  maxItems: 10
                  items:
                    type: object
                    additionalProperties: false
                    required: [questionId, prediction]
                    properties:
                      questionId: { type: string }
                      prediction: { type: string, nullable: true, enum: [POSITIVE, NEGATIVE, null], description: 'POSITIVE = 오른다, NEGATIVE = 내린다, null = 고르지 않음(틀림)' }
      responses:
        '200':
          description: 채점 결과와 이번 대회 내 기록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VirtualContestPlacementResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /virtual-sim/contests/current/rounds:
    post:
      tags: [virtual-sim]
      summary: '대회 판 시작(회원, 배치고사 뒤). 대회 잔액 전부·지금 판으로 시작하고 사건 4개 고정, 판 진행은 /virtual-sim/state·step·decision·end'
      description: 'no-store. 투자금·판을 받지 않고 대회 잔액을 initialAmount로, 지금 판의 출제 규칙(판별 변동성 등급·유형 고르기)을 쓴다(§5 최초 매수 그대로, 채점 없음). policies §8-8. 같은 startId는 같은 판: 세션이 살아 있으면 같은 응답, 이미 끝났으면 409 PRACTICE_CONFLICT, 하루 판 수에 세지 않는다. 진행 중인 다른 판이 있으면 그 판을 남은 사건 유지로 끝까지 돌려 정산한 뒤 시작한다. 오류: 배치고사 전 409 CONTEST_NOT_JOINED, 기간 밖 409 CONTEST_CLOSED, 청산 409 CONTEST_LIQUIDATED, 하루 10판 초과 429 CONTEST_DAILY_LIMIT(retryAfterSeconds = 다음 날 00:00 KST까지), 판에 맞는 후보가 없으면 503 PRACTICE_UNAVAILABLE, 세션 상한 503 PRACTICE_CAPACITY'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [startId]
              properties:
                startId: { type: string, format: uuid }
      responses:
        '200':
          description: 'version=0, 첫 봉만 공개. snapshot은 contest가 반드시 있는 VirtualContestRoundSnapshot이다. 이 세션이 끝나면(완주·end·30분 만료·서버 재시작·대회 마감) 서버가 남은 봉을 끝까지 돌려 마지막 봉 총자산을 새 대회 잔액으로 한 번만 반영한다. 하루 점수·주간 승급·강등은 날·주가 끝난 뒤 정한다(policies §8-8)'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [sessionToken, expiresAt, snapshot, round]
                properties:
                  sessionToken: { type: string, minLength: 43, maxLength: 128 }
                  expiresAt: { type: string, format: date-time }
                  snapshot: { $ref: '#/components/schemas/VirtualContestRoundSnapshot' }
                  round:
                    type: object
                    additionalProperties: false
                    required: [roundNumber, startBalance, roundsLeftToday]
                    properties:
                      roundNumber: { type: integer, minimum: 1, description: '이번 대회에서 몇 번째 판인가' }
                      startBalance: { type: integer, format: int64, minimum: 1000000, description: '이 판을 시작한 대회 잔액(= snapshot.initialAmount)' }
                      roundsLeftToday: { type: integer, minimum: 0, maximum: 9, description: '이 판을 뺀 오늘(KST) 남은 판 수' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /virtual-sim/contests/{contestId}/boards/{board}/ranking:
    parameters:
      - { name: contestId, in: path, required: true, schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }, description: '대회 이름 YYYY-MM. 이번 대회 또는 보관 중인 지난 대회(끝난 뒤 12개월)' }
      - { name: board, in: path, required: true, schema: { $ref: '#/components/schemas/VirtualContestBoard' } }
    get:
      tags: [virtual-sim]
      summary: '판별 랭킹(회원만). 상위 100위와 내 순위'
      description: '판 점수 큰 순, 같으면 평균 초과 수익률(excessRate, 끝낸 판이 없으면 0) 큰 순, 같으면 그 값에 먼저 도달한 사람(마지막으로 잔액이 바뀐 시각, 판이 없으면 참가 시각), 같으면 먼저 참가한 사람, 그것도 같으면 웹 회원 번호가 작은 사람(같은 순위 번호 없음). 진행 중 대회는 지금 그 판에 있는 참가자로 계산(진행 중인 판은 시작 잔액), 정산 뒤에는 마지막 판의 확정 순위. 탈퇴한 회원의 행은 빠지고 다른 확정 순위 번호는 그대로. 없는 대회·보관 기간이 지난 대회는 404'
      responses:
        '200':
          description: 랭킹
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VirtualContestRanking' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
