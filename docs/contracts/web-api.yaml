        noticeKey: { type: string, enum: [PRICE_PAST] }
        notice: { type: string }
        isSample: { type: boolean }
    PriceEvents:
      type: object
      required: [id, period, startDate, endDate, items, noticeKey]
      additionalProperties: false
      properties:
        id: { type: string }
        period: { $ref: '#/components/schemas/PricePeriod' }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        items:
          type: array
          items:
            type: object
            required: [id, code, scope, startDate, endDate, windowDays, direction, returnRate, marketReturn, headline,
              hasExplanation, sourceName, sourceCount, topSource, score]
            additionalProperties: false
            properties:
              id: { type: integer, format: int64 }
              code: { type: string, nullable: true }
              scope: { type: string, enum: [STOCK, MARKET] }
              startDate: { type: string, format: date }
              endDate: { type: string, format: date }
              windowDays: { type: integer }
              direction: { type: string, enum: [RISE, FALL] }
              returnRate: { type: number }
              marketReturn: { type: number, nullable: true }
              headline: { type: string }
              hasExplanation: { type: boolean }
              sourceName: { type: string, nullable: true }
              sourceCount: { type: integer }
              topSource: { type: string, nullable: true }
              score: { type: number }
        noticeKey: { type: string, enum: [EVENT_EXPLAIN] }
    IndexStrip:
      type: object
      required: [items, sources, isSample]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            type: object
            required: [key, name, kind, unit, value, prevValue, change, changeRate, date, sourceName]
            additionalProperties: false
            properties:
              key: { type: string, enum: [KOSPI, KOSDAQ, NASDAQ100, SP500, DJIA, NIKKEI225, GOLD, USDKRW, JPYKRW] }
              name: { type: string, description: '화면 표시 이름(예: 코스피, S&P500, 금, 원/달러)' }
              kind: { type: string, enum: [INDEX, COMMODITY, FX] }
              unit: { type: string, enum: [POINT, KRW_PER_GRAM, KRW_PER_USD, KRW_PER_100JPY] }
              value: { type: number, description: 'POINT·환율은 소수 2자리, KRW_PER_GRAM은 정수' }
              prevValue: { type: number }
              change: { type: number }
              changeRate: { type: number, description: '소수 4자리 내림' }
              date: { type: string, format: date, description: '이 칸의 기준일' }
              sourceName: { type: string, description: '제공처 이름(키움증권·한국투자증권·한국거래소 등)' }
        sources: { type: array, items: { $ref: '#/components/schemas/SourceRow' } }
        isSample: { type: boolean }
    IndustryListing:
      type: object
      required: [board, items, classificationVersion, classificationAsOf, sources, note, isSample]
      additionalProperties: false
      properties:
        board: { type: string, enum: [KOSPI, KOSDAQ] }
        items:
          type: array
          items:
            type: object
            required: [categoryCode, categoryName, totalMarketCap, instruments]
            additionalProperties: false
            properties:
              categoryCode: { type: string, description: '내부 식별자(업종명 SHA-256 앞 24자리). 공식 업종 코드 아님' }
              categoryName: { type: string }
              totalMarketCap: { type: integer, format: int64, nullable: true }
              instruments:
                type: array
                items:
                  type: object
                  required: [id, name, rank, marketCap]
                  additionalProperties: false
                  properties:
                    id: { type: string }
                    name: { type: string }
                    rank: { type: integer, minimum: 1, description: '시장 전체 시가총액 순위' }
                    marketCap: { type: integer, format: int64, nullable: true }
        classificationVersion: { type: string, enum: [KIWOOM_UPNAME_V1] }
        classificationAsOf: { type: string, format: date, nullable: true }
        sources: { type: array, items: { $ref: '#/components/schemas/SourceRow' } }
        note: { type: string, nullable: true, description: '현재 업종을 과거에 적용·수집 대상 안에서만 묶었다는 안내' }
        isSample: { type: boolean }

    FundingMode:
      type: string
      enum: [LUMP_SUM, SPLIT, PACE]
    RunResponse:
      type: object
      required: [resolvedInput, contributionCount, monthlyAmount, totalInvested, finalValue, profit, returnRate,
        engineVersion, dataAsOf, seriesBasis, legs, series, events, assumptions, noticeKey, notice, sources]
      additionalProperties: false
      properties:
