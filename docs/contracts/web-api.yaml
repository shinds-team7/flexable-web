      type: object
      required: [summary, ageMin, ageMax, incomeLimit, employment, marital, schools, majors, special]
      additionalProperties: false
      description: |
        신청 대상 조건. employment·marital·schools·majors·special은 온통청년 코드(jobCd·mrgSttsCd·schoolCd·plcyMajorCd·sbizCd)를 이름으로 바꾼 값이다.
        null = 원문에서 확인 못 함(조건 없음이 아님), 빈 배열 = 제한 없음, 값이 있으면 그중 하나에 해당해야 한다.
