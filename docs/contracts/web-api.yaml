            properties:
              upTo: { type: integer, format: int64, nullable: true }
              rate: { type: number }
              amount: { type: integer, format: int64 }
        interestPreTax: { type: integer, format: int64, description: 'floor(amount × baseRate × days ÷ 36500). TIERED는 floor(Σ 구간 금액 × 구간 금리 × days ÷ 36500)' }
        tax: { type: integer, format: int64, description: 'floor(interestPreTax × 0.154)' }
        interestAfterTax: { type: integer, format: int64 }
        rulesVersion: { type: string, example: parking-calc-v2 }
        notice: { type: string }
