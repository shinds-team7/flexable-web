<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>텅장관리 코드 학습 가이드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 왼쪽 학습 순서 목차 + 오른쪽 본문. 설명 모드는 목차를 숨기고 한 장씩 넘긴다.
   색은 제품(src/styles/tokens.css)의 브랜드 블루와 회색을 그대로 쓰고, 실행 위치(레이어)마다 의미 색을 하나씩 둔다. */
:root{
  --bg:#FFFFFF; --bg-sub:#F4F6F9; --surface:#FFFFFF; --line:#E1E5EB; --line-strong:#C5CCD6;
  --fg:#191F28; --fg2:#4E5968; --fg3:#6B7684;
  --accent:#0046FF; --accent-ink:#0046FF; --accent-wash:#EEF3FF; --on-accent:#FFFFFF;
  --ok:#0E7A4F; --ok-wash:#E4F5EC; --warn:#B95E00; --warn-wash:#FFF2E0; --bad:#D92D20; --bad-wash:#FDEDEC;
  --l-browser:#0046FF; --l-proxy:#5B6B82; --l-api:#6941C6; --l-db:#B54708; --l-app:#C11574; --l-ext:#475467; --l-worker:#0E7A4F;
  --code-bg:#F4F6F9;
  --font:"IBM Plex Sans KR","Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,"D2Coding",monospace;
  --r:10px; --r-sm:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F131A; --bg-sub:#171C25; --surface:#141922; --line:#273041; --line-strong:#3A4559;
  --fg:#E8ECF2; --fg2:#B3BCC9; --fg3:#8A95A6;
  --accent:#4D7CFF; --accent-ink:#8DACFF; --accent-wash:#17213D; --on-accent:#FFFFFF;
  --ok:#4CC38A; --ok-wash:#11291F; --warn:#F0A040; --warn-wash:#2E2110; --bad:#F2766B; --bad-wash:#33171A;
  --l-browser:#7A9CFF; --l-proxy:#9AA8BC; --l-api:#A98BF0; --l-db:#F0A040; --l-app:#F07AB8; --l-ext:#A3ADBD; --l-worker:#4CC38A;
  --code-bg:#1B212C; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F131A; --bg-sub:#171C25; --surface:#141922; --line:#273041; --line-strong:#3A4559;
  --fg:#E8ECF2; --fg2:#B3BCC9; --fg3:#8A95A6;
  --accent:#4D7CFF; --accent-ink:#8DACFF; --accent-wash:#17213D; --on-accent:#FFFFFF;
  --ok:#4CC38A; --ok-wash:#11291F; --warn:#F0A040; --warn-wash:#2E2110; --bad:#F2766B; --bad-wash:#33171A;
  --l-browser:#7A9CFF; --l-proxy:#9AA8BC; --l-api:#A98BF0; --l-db:#F0A040; --l-app:#F07AB8; --l-ext:#A3ADBD; --l-worker:#4CC38A;
  --code-bg:#1B212C; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--accent-ink)}
code,pre,.mono{font-family:var(--mono);font-size:.88em}
code{background:var(--code-bg);padding:.1em .35em;border-radius:4px}
h1,h2,h3,h4{text-wrap:balance;line-height:1.35;margin:0}
h1{font-size:1.9rem;font-weight:700;letter-spacing:-.02em}
h2{font-size:1.35rem;font-weight:700;letter-spacing:-.01em}
h3{font-size:1.08rem;font-weight:600}
h4{font-size:.95rem;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:.75rem;font-weight:600;letter-spacing:.08em;color:var(--fg3);text-transform:uppercase}

/* 상단 바 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--fg);font-weight:700;margin-right:auto}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:.8rem;font-family:var(--mono)}
.brand small{font-weight:500;color:var(--fg3);font-size:.78rem}
.modes{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.modes a{padding:4px 14px;border-radius:999px;text-decoration:none;color:var(--fg2);font-size:.88rem;font-weight:500}
.modes a[aria-current="true"]{background:var(--accent);color:var(--on-accent)}
.search{position:relative;flex:1 1 260px;max-width:420px}
.search input{width:100%;height:36px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--fg);padding:0 12px;font:inherit;font-size:.9rem}
.results{position:absolute;left:0;right:0;top:40px;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 10px 30px rgba(17,24,39,.15);max-height:60vh;overflow:auto;z-index:20}
.results a{display:block;padding:8px 12px;text-decoration:none;color:var(--fg);border-bottom:1px solid var(--line)}
.results a:last-child{border-bottom:0}
.results a:hover,.results a.on{background:var(--accent-wash)}
.results .t{font-size:.72rem;color:var(--fg3);font-weight:600;margin-right:6px}
.results .s{display:block;font-size:.8rem;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 본문 틀 */
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 58px)}
.side{border-right:1px solid var(--line);padding:18px 14px 40px;background:var(--bg-sub);position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);height:calc(100vh - 57px);overflow:auto}
.side h4{margin:14px 8px 6px;font-size:.72rem;letter-spacing:.08em;color:var(--fg3)}
.side a{display:flex;gap:8px;align-items:baseline;padding:6px 8px;border-radius:7px;text-decoration:none;color:var(--fg2);font-size:.9rem}
.side a:hover{background:var(--surface)}
.side a[aria-current="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.side .n{font-family:var(--mono);font-size:.72rem;color:var(--fg3);min-width:1.6em}
.side .done{margin-left:auto;color:var(--ok);font-size:.8rem}
main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 80px}
.wrap{max-width:980px;margin:0 auto;display:grid;gap:28px}
.prose{max-width:68ch;display:grid;gap:12px}
.lead{font-size:1.05rem;color:var(--fg2)}
.muted{color:var(--fg3)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:16px 18px;display:grid;gap:8px;min-width:0}
.box{border-radius:var(--r);background:var(--bg-sub);padding:16px 18px;display:grid;gap:10px;min-width:0}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);text-decoration:none;color:var(--fg);font-weight:500;font-size:.9rem;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.4;cursor:default}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid var(--line-strong);color:var(--fg2);white-space:nowrap;text-decoration:none}
a.chip:hover{border-color:var(--accent);color:var(--accent-ink)}
.ev{font-size:.72rem;font-weight:600;padding:1px 7px;border-radius:5px;white-space:nowrap}
.ev.code{background:var(--accent-wash);color:var(--accent-ink)}
.ev.test{background:var(--ok-wash);color:var(--ok)}
.ev.infer{background:var(--warn-wash);color:var(--warn)}
.ev.ops{background:var(--bad-wash);color:var(--bad)}
.ev.plan{background:var(--bg-sub);color:var(--fg3);border:1px dashed var(--line-strong)}
ul.clean{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ul.dots{margin:0;padding-left:1.2em;display:grid;gap:4px}
.ref{display:inline-flex;align-items:center;gap:2px;font-family:var(--mono);font-size:.8rem;white-space:nowrap;max-width:100%}
.ref a{text-decoration:none;border-bottom:1px dotted currentColor;overflow:hidden;text-overflow:ellipsis}
.copy{border:0;background:none;color:var(--fg3);font-size:.7rem;cursor:pointer;padding:0 4px;font-family:var(--font)}
.copy:hover{color:var(--accent-ink)}
.refs{display:flex;flex-wrap:wrap;gap:4px 14px}
pre.code{background:var(--code-bg);border-radius:var(--r-sm);padding:12px 14px;overflow-x:auto;margin:0;line-height:1.55;font-size:.82rem}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm)}
.tbl table{border-collapse:collapse;width:100%;font-size:.84rem}
.tbl th,.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{background:var(--bg-sub);font-weight:600;color:var(--fg2);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tbl td code{white-space:nowrap}
.tbl .nul{color:var(--fg3);font-style:italic}
details.qa{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
details.qa summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;gap:10px}
details.qa summary::-webkit-details-marker{display:none}
details.qa summary::before{content:"Q";font-family:var(--mono);color:var(--accent-ink);font-weight:700}
details.qa[open] summary{border-bottom:1px solid var(--line)}
details.qa .a{padding:12px 16px 16px;display:grid;gap:8px}
details.qa .a::before{content:"답";font-size:.72rem;font-weight:700;color:var(--ok)}
.sec{display:grid;gap:12px}
.sec > .eyebrow{display:flex;gap:8px;align-items:center}
.k{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:4px;letter-spacing:.02em}
.k.basic{background:var(--accent-wash);color:var(--accent-ink)}
.k.ours{background:var(--ok-wash);color:var(--ok)}
.k.run{background:var(--warn-wash);color:var(--warn)}
.k.check{background:var(--bad-wash);color:var(--bad)}
hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0}

/* 레이어 색 */
.lyr{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;color:var(--fg2);white-space:nowrap}
.lyr::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--c)}

/* 요청 흐름(세로 순서도) */
.flowpick{display:flex;gap:6px;flex-wrap:wrap}
.flowpick a{font-size:.85rem;padding:5px 12px;border-radius:999px;border:1px solid var(--line-strong);text-decoration:none;color:var(--fg2)}
.flowpick a[aria-current="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seqwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.seq{display:grid;min-width:calc(var(--cols) * 104px + 44px)}
.seq .hd,.seq .st{display:grid;grid-template-columns:44px repeat(var(--cols),minmax(104px,1fr))}
.seq .hd{position:sticky;top:0;background:var(--bg-sub);border-bottom:1px solid var(--line);font-size:.74rem;font-weight:600;color:var(--fg2)}
.seq .hd div{padding:8px 6px;text-align:center;border-top:3px solid var(--c,transparent)}
.seq .st{border:0;background:none;padding:0;text-align:left;cursor:pointer;width:100%}
.seq .st:hover{background:var(--bg-sub)}
.seq .st.on{background:var(--accent-wash)}
.seq .no{font-family:var(--mono);font-size:.74rem;color:var(--fg3);display:grid;place-items:center}
.seq .cell{position:relative;min-height:40px;display:flex;align-items:center;justify-content:center;padding:4px}
.seq .cell::before{content:"";position:absolute;top:0;bottom:0;left:50%;border-left:1px dashed var(--line-strong)}
.seq .node{position:relative;z-index:1;font-size:.76rem;line-height:1.3;padding:5px 8px;border-radius:6px;background:var(--surface);border:1.5px solid var(--c);color:var(--fg);text-align:center;max-width:150px}
.seq .st.on .node{background:var(--c);color:#fff;font-weight:600}
.detail{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.detail .f{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;display:grid;gap:6px;align-content:start;min-width:0;background:var(--surface)}
.detail .f.wide{grid-column:1/-1}
.detail .lab{font-size:.72rem;font-weight:700;color:var(--fg3);letter-spacing:.04em}
.dbk{display:inline-flex;gap:6px;align-items:center;font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:5px}
.dbk.read{background:var(--warn-wash);color:var(--warn)}
.dbk.write{background:var(--bad-wash);color:var(--bad)}
.dbk.none{background:var(--bg-sub);color:var(--fg3)}
.dbk.mem{background:var(--accent-wash);color:var(--accent-ink)}
.dbk.browser{background:var(--ok-wash);color:var(--ok)}
.stepnav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stepnav .pos{font-family:var(--mono);font-size:.82rem;color:var(--fg3)}

/* 지도·ERD(SVG) */
.diag{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.diag svg{display:block;width:100%;min-width:760px;height:auto}
.diag text{font-family:var(--font);fill:var(--fg)}
.diag .sub{fill:var(--fg3);font-size:11px}
.diag .edge{stroke:var(--fg3);stroke-width:1.4;fill:none}
.diag .edge.dash{stroke-dasharray:5 4}
.diag .elab{font-size:10.5px;fill:var(--fg2)}
.diag .nodebox{cursor:pointer}
.diag .nodebox rect.b{fill:var(--surface);stroke:var(--c);stroke-width:1.5}
.diag .nodebox.on rect.b{fill:var(--accent-wash);stroke-width:2.5}
.diag .nodebox:hover rect.b{stroke-width:2.5}
.diag .grp{fill:var(--bg-sub);stroke:none}
.diag .grplab{font-size:11px;font-weight:600;fill:var(--fg3)}
.diag .col{font-family:var(--mono);font-size:10.5px;fill:var(--fg2)}
.diag .pk{fill:var(--accent-ink);font-weight:600}

/* 표 사전 */
.tlist{display:flex;flex-wrap:wrap;gap:6px}
.tlist a{font-family:var(--mono);font-size:.8rem;padding:3px 9px;border-radius:6px;border:1px solid var(--line);text-decoration:none;color:var(--fg2)}
.tlist a[aria-current="true"]{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-wash)}

/* 단원 */
.unithead{display:grid;gap:8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.endbox{border:1.5px solid var(--line-strong);border-radius:var(--r);padding:18px 20px;display:grid;gap:16px;background:var(--surface)}
.endbox h3{display:flex;gap:8px;align-items:center}
.checks li{display:flex;gap:8px}
.checks li::before{content:"□";color:var(--fg3)}
.order{counter-reset:o;display:grid;gap:8px;list-style:none;margin:0;padding:0}
.order li a{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:var(--fg);background:var(--surface)}
.order li a:hover{border-color:var(--accent)}
.order .n{font-family:var(--mono);color:var(--accent-ink);font-weight:600}
.order .g{display:block;color:var(--fg3);font-size:.85rem}

/* 설명 모드 */
body.explain .shell{grid-template-columns:minmax(0,1fr)}
body.explain .side{display:none}
.slide{display:grid;gap:22px;max-width:1080px;margin:0 auto}
.slidebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots a{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-family:var(--mono);font-size:.78rem;text-decoration:none;color:var(--fg2);border:1px solid var(--line)}
.dots a[aria-current="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.slide h1{font-size:2.1rem}
.talk{border-left:3px solid var(--line-strong);padding-left:14px;color:var(--fg2);display:grid;gap:6px}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .side nav{display:flex;flex-wrap:wrap;gap:2px}
  .side h4{width:100%}
  h1{font-size:1.55rem}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#start"><span class="mark">fx</span><span>텅장관리 코드 학습 가이드<br><small id="baseline"></small></span></a>
  <nav class="modes" aria-label="모드">
    <a href="#start" id="m-learn">학습 모드</a>
    <a href="#explain.1" id="m-explain">설명 모드</a>
  </nav>
  <div class="search" role="search">
    <input id="q" type="search" placeholder="검색: 파일·함수·테이블·개념 (/ 키)" autocomplete="off" aria-label="가이드 검색">
    <div class="results" id="results" hidden></div>
  </div>
</header>
<div class="shell">
  <aside class="side" id="side"></aside>
  <main id="main"><div class="wrap"><p class="muted">불러오는 중…</p></div></main>
</div>

<script>
// 내용 파일(content/*.js)이 쓰는 코드 위치 표기. 줄 번호는 check-refs.mjs가 실제 파일에서 찾아 채운다.
window.R = (f, s, l) => ({ f, s, l: l || 0 });
window.G = {};
</script>
<script src="content/meta.js"></script>
<script src="content/units.js"></script>
<script src="content/flows.js"></script>
<script src="content/code.js"></script>
<script src="content/db.js"></script>
<script src="content/concepts.js"></script>
<script src="content/design.js"></script>
<script src="app.js"></script>
</body>
</html>
