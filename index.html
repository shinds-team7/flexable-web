<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>텅장관리</title>
    <meta name="description" content="앱에서 아낀 돈으로 지난 주식·적금을 실험해 보는 텅장관리 웹" />
    <link rel="icon" href="/favicon.png" />
    <script>
      // 기본은 라이트. 사용자가 내 정보에서 다크를 고른 경우에만 다크(시스템 설정은 따르지 않는다).
      try { if (localStorage.getItem('fx.theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
